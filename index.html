<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d5a7a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ficha SJC"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="config.js"></script></head><body>
<title>Ficha de Taller SJC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra superior fija + pestañas grandes para tablet; la ficha se edita como una planilla en tarjetas por sección */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --line:#d5dbe0; --fg:#1b2329; --muted:#5d6b75;
  --accent:#1d5a7a; --accent-fg:#ffffff; --accent-soft:#dbe9f1;
  --ok:#2f7d46; --ok-soft:#dcefe2; --warn:#a86b00; --warn-soft:#fbeccb; --bad:#b3261e; --bad-soft:#f8dcd9; --na:#6b7680; --na-soft:#e4e8eb;
  --font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
  --t-mixer:#e2601b; --t-camion:#1f6fc2; --t-tracto:#5a45c8; --t-semi:#0d8a80; --t-pluma:#c28a00; --t-liviano:#3b8f2f; --t-otro:#5d6b75;
  --s1:#1f6fc2; --s2:#e2601b; --s3:#5a45c8; --s4:#c28a00; --s5:#3b8f2f; --sf:#0d8a80;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181c; --surface:#1a2228; --surface-2:#202a31; --line:#33414b; --fg:#e6ecef; --muted:#9aa9b3;
  --accent:#5fa8d3; --accent-fg:#0d1418; --accent-soft:#1d3442;
  --ok:#6cc58a; --ok-soft:#1d3526; --warn:#e8b04a; --warn-soft:#3a2f17; --bad:#f08279; --bad-soft:#3d1f1d; --na:#9aa6af; --na-soft:#2a343b;
  --t-mixer:#ff8a4c; --t-camion:#5aa6f0; --t-tracto:#9b8cf2; --t-semi:#3cc4b8; --t-pluma:#f0bd3c; --t-liviano:#79cc6a; --t-otro:#9aa9b3;
  --s1:#5aa6f0; --s2:#ff8a4c; --s3:#9b8cf2; --s4:#f0bd3c; --s5:#79cc6a; --sf:#3cc4b8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --surface:#1a2228; --surface-2:#202a31; --line:#33414b; --fg:#e6ecef; --muted:#9aa9b3;
  --accent:#5fa8d3; --accent-fg:#0d1418; --accent-soft:#1d3442;
  --ok:#6cc58a; --ok-soft:#1d3526; --warn:#e8b04a; --warn-soft:#3a2f17; --bad:#f08279; --bad-soft:#3d1f1d; --na:#9aa6af; --na-soft:#2a343b;
  --t-mixer:#ff8a4c; --t-camion:#5aa6f0; --t-tracto:#9b8cf2; --t-semi:#3cc4b8; --t-pluma:#f0bd3c; --t-liviano:#79cc6a; --t-otro:#9aa9b3;
  --s1:#5aa6f0; --s2:#ff8a4c; --s3:#9b8cf2; --s4:#f0bd3c; --s5:#79cc6a; --sf:#3cc4b8;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--accent-soft),var(--bg) 340px) no-repeat,var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-fg);box-shadow:0 2px 0 0 transparent}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;background:linear-gradient(90deg,var(--t-mixer) 0 17%,var(--t-camion) 17% 34%,var(--t-tracto) 34% 51%,var(--t-semi) 51% 68%,var(--t-pluma) 68% 85%,var(--t-liviano) 85%)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto}
.brand h1{font-size:26px;text-transform:uppercase}
.brand small{font-size:13px;opacity:.85}
.tabs{display:flex;gap:6px}
.tab{background:transparent;border:2px solid transparent;color:inherit;padding:8px 16px;border-radius:999px;font-weight:600;min-height:44px}
.tab[aria-current="true"]{background:var(--accent-fg);color:var(--accent)}
.tab:not([aria-current="true"]):hover{background:rgb(255 255 255 / .12)}
.sync{font-size:13px;display:flex;align-items:center;gap:6px;opacity:.95}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
main.wrap{padding-block:20px 80px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 16px;min-height:46px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;min-height:46px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.truck{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:var(--r);display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 1px 3px rgb(0 0 0 / .06)}
.truck .band{background:var(--tc,var(--t-otro));color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.truck .band .umc{color:#fff}.truck .band .tipo{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgb(255 255 255 / .22);padding:3px 10px;border-radius:99px;white-space:nowrap}
.truck .pic{aspect-ratio:16/9;background:var(--surface-2);max-width:100%;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.truck .pic img{width:100%;height:100%;object-fit:cover;display:block}
.truck .inner{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.plate.lt{background:#fff;color:#14202a;border-color:#14202a}
.tfil{display:flex;gap:8px;flex-wrap:wrap}
.tfil button{border:2px solid var(--tc,var(--line));background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 14px;min-height:42px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tfil button i{width:12px;height:12px;border-radius:50%;background:var(--tc,var(--t-otro));display:inline-block}
.tfil button[aria-pressed="true"]{background:var(--tc,var(--accent));color:#fff}.tfil button[aria-pressed="true"] i{background:#fff}
.cover{display:grid;grid-template-columns:minmax(0,320px) 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgb(0 0 0 / .06)}
.cover .cimg{aspect-ratio:4/3;background:var(--surface-2);position:relative;max-width:100%}
.cover .cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cover .cimg .ph0{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);padding:12px;text-align:center}
.cover .cbtns{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover .cbtns .btn{min-height:40px;padding:6px 12px;font-size:14px;background:rgb(255 255 255 / .92);color:#14202a;border-color:transparent}
.cover .cinfo{border-top:8px solid var(--tc,var(--accent));padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cover .cinfo .umc{font-size:46px;color:var(--tc,var(--fg))}
.cover .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;font-size:15px}
.cover .kv span:first-child{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tchip{background:var(--tc,var(--t-otro));color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:99px;white-space:nowrap}
.card[style*="--sc"]{border-top:5px solid var(--sc)}
.card[style*="--sc"] h3 .n{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:99px;background:var(--sc);color:#fff;font-size:18px}
.secnav a[style]{border-left:6px solid var(--sc)}
@media (max-width:700px){.cover{grid-template-columns:1fr}}
.plate{font-family:var(--font-mono);font-weight:600;font-size:22px;letter-spacing:.06em;border:2px solid var(--fg);border-radius:6px;padding:2px 10px;display:inline-block;background:var(--surface-2)}
.chip{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.na{background:var(--na-soft);color:var(--na)}
.truck .meta{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.truck .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.truck .actions .btn{flex:1;min-width:120px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ex{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}
/* tabla historial */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
/* editor */
.edhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.edhead h2{font-size:28px}
.secnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto}
.secnav a{flex:none;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:140px;min-width:0}
.card h3{font-size:21px;text-transform:uppercase;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3 .n{color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;min-height:46px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;align-items:center}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:0 24px}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.item .num{font-family:var(--font-mono);color:var(--muted);font-size:14px}
.item .name{font-weight:600;min-width:0}
.item .name input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 8px;width:100%;margin-top:4px;font-weight:400}
.est{display:flex;gap:4px}
.est button{width:48px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:15px}
.est button.na{width:54px;font-size:13px}
.est button[data-v="B"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.est button[data-v="R"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.est button[data-v="M"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.est button[data-v="NA"][aria-pressed="true"]{background:var(--na);border-color:var(--na);color:var(--surface)}
.item .obs{grid-column:2/-1}
.item .obs input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-height:42px}
.item.need .obs input{border-color:var(--bad);background:var(--bad-soft)}
.jobs{min-width:820px}
.jobs td{padding:6px;white-space:normal}
.jobs input,.jobs select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px;min-height:42px}
.jobs tbody tr{cursor:default} .jobs tbody tr:hover{background:transparent}
.jobs select{min-width:120px}
.jobs tfoot td{font-weight:700;border-bottom:0}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sig{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);min-width:0}
.sig canvas{width:100%;height:120px;background:var(--surface);border:1px dashed var(--line);border-radius:6px;touch-action:none;display:block}
.sig img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}
.sig input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px;min-height:42px;width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px;flex-wrap:wrap}
.bar .stat{margin-right:auto;font-size:14px}
.overlay{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.modal{background:var(--surface);border-radius:14px;max-width:720px;width:100%;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal h2{font-size:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px)}
.closed-banner{background:var(--ok-soft);color:var(--ok);border-radius:var(--r);padding:12px 16px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.readonly input,.readonly select,.readonly textarea,.readonly .est button,.readonly .seg button{pointer-events:none}
.umc{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;text-transform:uppercase}
.plate.sm{font-size:15px;padding:1px 7px;border-width:1.5px}
.camb{white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-height:40px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.camb.has{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph button.thumb{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);max-width:100%;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tagi{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.ph .tagl{position:absolute;right:6px;top:6px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px}
.ph input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;min-height:40px;width:100%;font-size:14px}
.addph{border:2px dashed var(--line);border-radius:8px;aspect-ratio:4/3;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;color:var(--accent);max-width:100%}
.addph span{font-size:34px;line-height:1}
.big{max-width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:#000}
.additem{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:10px}
.additem input[type=text]{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;min-height:46px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.chk input{width:22px;height:22px}
.xtra{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.prev{max-height:340px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-left:4px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;width:100%;text-align:left;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:14px 16px;font-size:17px;min-height:52px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:30px;line-height:1.1}.tile span{color:var(--muted);font-size:14px}
.tile{border-top:5px solid var(--accent)}.tile.bad{border-color:var(--bad);background:var(--bad-soft)}.tile.bad b{color:var(--bad)}
.alist{display:flex;flex-direction:column;gap:10px}
.alerta{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);min-width:0}
.alerta.m{border-left-color:var(--bad)}.alerta.r{border-left-color:var(--warn)}.alerta.done{border-left-color:var(--ok);opacity:.85}
.al-umc{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.al-body{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.tl{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tl li.resuelta{color:var(--ok);font-weight:600}.tl li.detectada{color:var(--bad)}

<script>
(function(){
"use strict";
/* ===== Ítems de la planilla (Ficha de Control de Taller) ===== */
const ITEMS=["Documentación y habilitaciones vigentes","Extintor (vigente y ubicación correcta)","Cinturón de seguridad","Luces delanteras / traseras","Luces de giro / balizas / stop","Bocina / claxon","Espejos retrovisores","Parabrisas sin fisuras","Limpiaparabrisas","Neumáticos (presión y estado general)","Rueda de auxilio / repuesto","Nivel de aceite motor","Nivel de refrigerante","Nivel líquido de frenos","Nivel dirección hidráulica","Frenos de servicio","Freno de mano / estacionamiento","Sistema de frenos neumáticos","Batería / instalación eléctrica","Sensor de giro","Filtro de aire","Filtro de combustible","Correas / bandas","Engrase general (chasis / pivotes)","Eje delantero / dirección","Suspensión delantera y trasera","Sistema hidráulico (si aplica)","Tambor mezclador","Motor hidráulico / rodillos (si aplica)","Bomba de agua / canaleta (si aplica)","Carrocería / cajón / volcador (si aplica)","Escaleras y agarraderas","Cabina interior (limpieza y orden)","Aire acondicionado","Tacógrafo / GPS","Medidor de combustible","Golpes / abolladuras externas","Tag de combustible","Bulones trompo a reductora","Otros"];
const MIXER_ONLY=[28,29,30,39];
const TIPOS=["Mixer","Camión","Tracto-camión","Semirremolque","Pluma","Vehículo liviano","Mediano","Pequeño"];
const TIPO_COLOR={"Mixer":"--t-mixer","Camión":"--t-camion","Tracto-camión":"--t-tracto","Semirremolque":"--t-semi","Pluma":"--t-pluma","Vehículo liviano":"--t-liviano"};
const tc=t=>`--tc:var(${TIPO_COLOR[t]||"--t-otro"})`;
const TIPO_ALIAS={semiremolque:"Semirremolque",semirremolque:"Semirremolque",tractocamion:"Tracto-camión",tractor:"Tracto-camión",vehiculoliviano:"Vehículo liviano",liviano:"Vehículo liviano",camion:"Camión",mixer:"Mixer",hormigonera:"Mixer",pluma:"Pluma"};
const COMBUSTIBLES=["Diésel","Nafta","GNC","Híbrido"];
const NIVELES=["Lleno","3/4","1/2","1/4"];
const TIPOS_MANT=["Menor","Mayor","Preventivo","Correctivo"];
const ESTADOS_TRABAJO=["Pendiente","En curso","Terminado"];
const FIRMAS=[["jefe","Jefe de taller"],["mecanico","Mecánico responsable"],["supervisor","Supervisor / Inspector"],["conductor","Conductor"]];
const EST_LABEL={B:"Bueno",R:"Regular",M:"Malo",NA:"No aplica"};

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fdate=s=>{if(!s)return"—";const [y,m,d]=s.split("-");return d&&m&&y?`${d}/${m}/${y}`:s};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const money=n=>n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let toastT;function toast(msg){const l=document.getElementById("toastbox")||Object.assign(document.body.appendChild(document.createElement("div")),{id:"toastbox"});l.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>l.innerHTML="",2600)}

/* ===== Almacenamiento: nube compartida si está disponible, si no, este dispositivo ===== */
const Store={
  mode:(window.claude?"init":"local"), db:null,
  data:Object.assign({camiones:{},fichas:{},config:{},alertas:{}},lsGet("sjc.cache",{})),
  pending:lsGet("sjc.pending",[]),
  persist(){if(!this.fb)lsSet("sjc.cache",this.data);lsSet("sjc.pending",this.pending)},
  list(col){return Object.values(this.data[col]||{})},
  get(col,id){return (this.data[col]||{})[id]},
  save(col,obj){obj.actualizado=new Date().toISOString();this.data[col][obj.id]=obj;this.queue({op:"set",col,id:obj.id,obj});},
  remove(col,id){delete this.data[col][id];this.queue({op:"del",col,id});},
  queue(w){if(this.mode!=="local"){this.pending=this.pending.filter(p=>!(p.col===w.col&&p.id===w.id));this.pending.push(w)}this.persist();this.flush();},
  flushing:false,
  async flush(){
    if(!this.db||this.flushing)return;this.flushing=true;
    while(this.pending.length){
      const w=this.pending[0];
      try{const ref=this.db.collection(w.col).doc(w.id);w.op==="set"?await ref.set(w.obj):await ref.delete();this.pending.shift();this.persist();}
      catch(e){setSync();break;}
    }
    this.flushing=false;setSync();
  },
  async init(){
    let db=null;
    if(window.FIREBASE_CONFIG){db=await initFirebase();if(!db)return;this.fb=true}
    else try{if(window.claude&&typeof window.claude.use==="function")db=await window.claude.use("db")}catch(e){db=null}
    if(!db){this.mode="local";setSync();render();return}
    this.db=db;this.mode="nube";setSync();
    if(this.fb){this.assets=null;["camiones","fichas","config","alertas"].forEach(col=>this.listen(db,col));this.flush();window.addEventListener("online",()=>this.flush());setInterval(()=>{if(this.pending.length)this.flush()},20000);return}
    try{this.assets=await window.claude.use("assets")}catch(e){this.assets=null}
    ["camiones","fichas","config","alertas"].forEach(col=>this.listen(db,col));
    this.flush();
    window.addEventListener("online",()=>this.flush());
    setInterval(()=>{if(this.pending.length)this.flush()},20000);
  },
  loaded:{}, assets:null, fb:false, user:"",
  listen(db,col){
      db.collection(col).onSnapshot(snap=>{
        const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]={...d.data(),id:d.id}});
        this.pending.forEach(p=>{if(p.col!==col)return;if(p.op==="set")next[p.id]=p.obj;else delete next[p.id]});
        this.data[col]=next;this.loaded[col]=true;this.persist();render(true);
      },err=>{toast("No se pudo leer la base: "+(err&&err.message||"error"));});
      }
};
/* Plantilla de ítems adicionales (se suman a las fichas nuevas) */
function plantilla(){return ((Store.get("config","checklist")||{}).extras)||[]}
function setPlantilla(extras){Store.save("config",{id:"checklist",extras})}

/* ===== Fotos: nube (assets) o esta tablet (IndexedDB) ===== */
const Fotos={
  _db:null,urls:{},
  idb(){if(this._db)return this._db;this._db=new Promise((res,rej)=>{try{const r=indexedDB.open("sjc-fotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this._db},
  async idbDo(mode,fn){const db=await this.idb();return new Promise((res,rej)=>{const tx=db.transaction("f",mode);const q=fn(tx.objectStore("f"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})},
  async compress(file){
    const url=URL.createObjectURL(file);
    try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",0.75));
    }finally{URL.revokeObjectURL(url)}
  },
  async add(file){
    const blob=await this.compress(file);
    if(Store.fb&&Store.fs){const id=uid("p");try{await this.idbDo("readwrite",s=>s.put(blob,id))}catch(e){}
      let data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
      if(data.length>900000){const im=await createImageBitmap(blob);const c=document.createElement("canvas");const k=Math.min(1,1100/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);data=c.toDataURL("image/jpeg",0.6)}
      Store.fs.collection("fotos").doc(id).set({data,creado:new Date().toISOString(),por:Store.user}).catch(()=>{});
      return {id,fb:true};}
    if(Store.assets){try{const r=await Store.assets.upload(blob);return {id:r.id,url:r.url,nube:true}}catch(e){toast("Sin conexión: la foto queda guardada en esta tablet")}}
    const id=uid("p");await this.idbDo("readwrite",s=>s.put(blob,id));return {id,nube:false};
  },
  async src(f){
    if(f.nube)return f.url||("/_blob/"+f.id);
    if(this.urls[f.id])return this.urls[f.id];
    if(f.fb){try{const b=await this.idbDo("readonly",s=>s.get(f.id));if(b)return this.urls[f.id]=URL.createObjectURL(b)}catch(e){}
      try{const d=await Store.fs.collection("fotos").doc(f.id).get();const x=d.exists&&d.data().data;return x?(this.urls[f.id]=x):""}catch(e){return ""}}
    try{const b=await this.idbDo("readonly",s=>s.get(f.id));if(!b)return "";return this.urls[f.id]=URL.createObjectURL(b)}catch(e){return ""}
  },
  async remove(f){if(f.fb){try{await this.idbDo("readwrite",s=>s.delete(f.id))}catch(e){}if(Store.fs)Store.fs.collection("fotos").doc(f.id).delete().catch(()=>{});return}try{if(f.nube&&Store.assets)await Store.assets.delete(f.id);else if(!f.nube)await this.idbDo("readwrite",s=>s.delete(f.id))}catch(e){}},
  async toDataURL(id){const b=await this.idbDo("readonly",s=>s.get(id));if(!b)return null;return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})},
  async fromDataURL(id,d){const [h,b64]=d.split(",");const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const b=new Blob([u],{type:(h.match(/:(.*?);/)||[])[1]||"image/jpeg"});await this.idbDo("readwrite",s=>s.put(b,id))}
};
function setSync(){
  const t=$("#synctxt");if(!t)return;
  if(Store.mode==="local")t.textContent="Guardado en esta tablet";
  else if(Store.pending.length)t.textContent=`${Store.pending.length} cambio(s) sin enviar`;
  else t.textContent="Sincronizado";
  const so=$("#salir");if(so)so.hidden=!Store.user;
}
/* ===== Firebase (app instalable con datos compartidos) ===== */
const FBV="10.12.2";
function cargarScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initFirebase(){
  try{if(!window.firebase||!firebase.firestore)for(const m of ["app","auth","firestore"])await cargarScript((window.FIREBASE_SDK||`https://www.gstatic.com/firebasejs/${FBV}/`)+`firebase-${m}-compat.js`)}
  catch(e){$("#synctxt").textContent="Sin conexión";$("#main").innerHTML=`<div class="empty"><strong>No se pudo abrir la app</strong><span class="muted">La primera vez hace falta internet. Conectate y volvé a abrirla.</span></div>`;return null}
  if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs=firebase.firestore(),auth=firebase.auth();
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  if(window.FIREBASE_EMU){fs.useEmulator("localhost",8080);auth.useEmulator("http://localhost:9099")}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  const user=await new Promise(res=>{const un=auth.onAuthStateChanged(u=>{un();res(u)})});
  if(!user){mostrarLogin(auth);return null}
  Store.user=user.email||"";Store.fs=fs;
  return fs;
}
function mostrarLogin(auth){
  $("#synctxt").textContent="Sin sesión";
  $("#main").innerHTML=`<form class="modal" id="login" style="margin:40px auto;max-width:420px"><h2>Ingresar</h2><p class="muted" style="margin:0">Usá el correo y la contraseña que te dieron para la app de control de flota.</p>
    <div class="f"><label for="lg-mail">Correo</label><input id="lg-mail" type="email" autocomplete="username" required></div>
    <div class="f"><label for="lg-pass">Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required></div>
    <p id="lg-err" style="margin:0;color:var(--bad);font-weight:600" hidden></p>
    <button class="btn primary" id="lg-ok">Ingresar</button></form>`;
  $("#login").onsubmit=async e=>{e.preventDefault();const b=$("#lg-ok");b.disabled=true;b.textContent="Ingresando…";
    try{await auth.signInWithEmailAndPassword($("#lg-mail").value.trim(),$("#lg-pass").value);location.reload()}
    catch(err){const m={"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/user-not-found":"Correo o contraseña incorrectos.","auth/invalid-email":"El correo no es válido.","auth/network-request-failed":"Sin conexión. La primera vez hace falta internet.","auth/too-many-requests":"Demasiados intentos. Esperá unos minutos."};
      const el=$("#lg-err");el.textContent=m[err.code]||"No se pudo ingresar ("+(err.code||"error")+").";el.hidden=false;b.disabled=false;b.textContent="Ingresar"}};
}
async function salir(){confirmar("¿Cerrar sesión en este equipo?","Cerrar sesión",async()=>{try{await firebase.auth().signOut()}catch(e){}try{localStorage.removeItem("sjc.cache");localStorage.removeItem("sjc.pending")}catch(e){}location.reload()})}

/* ===== Modelo ===== */
function nextNumero(){const ns=Store.list("fichas").map(f=>parseInt(f.numero,10)||0);return String((ns.length?Math.max(...ns):0)+1).padStart(5,"0")}
function newFicha(c){
  const items={};ITEMS.forEach((_,i)=>{items[i+1]={estado:"",obs:""}});
  const extras=plantilla().map(x=>({id:x.id,nombre:x.nombre}));extras.forEach(x=>{items[x.id]={estado:"",obs:""}});
  return {id:uid("f"),numero:nextNumero(),camionId:c.id,estado:"abierta",creada:new Date().toISOString(),creadoPor:Store.user||"",
    fechaEntrada:today(),fechaSalida:"",
    vehiculo:{umc:c.umc,patente:c.patente,marca:c.marca,modelo:c.modelo,anio:c.anio,tipo:c.tipo,chasis:c.chasis,propietario:c.propietario,aseguradora:c.aseguradora,combustible:c.combustible},
    km:"",horometro:"",conductor:"",cedula:"",telefono:"",nivel:"",motivo:"",
    items,extras,fotos:[],otros:"",trabajos:[],obsMecanico:"",obsConductor:"",
    proximo:{fecha:"",km:"",tipo:"",pendientes:""},
    firmas:{jefe:{},mecanico:{},supervisor:{},conductor:{}}};
}
function resumen(f){
  const ks=keysOf(f);let B=0,R=0,M=0,NA=0,done=0;
  ks.forEach(k=>{const v=(f.items||{})[k]||{};if(v.estado){done++;if(v.estado==="B")B++;else if(v.estado==="R")R++;else if(v.estado==="M")M++;else NA++}});
  return {B,R,M,NA,done,total:ks.length};
}
function keysOf(f){return [...ITEMS.slice(0,39).map((_,i)=>String(i+1)),...((f&&f.extras)||[]).map(x=>x.id),"40"]
}
function fichasDe(cid){return Store.list("fichas").filter(f=>f.camionId===cid).sort((a,b)=>(b.fechaEntrada||"").localeCompare(a.fechaEntrada||"")||(b.numero||"").localeCompare(a.numero||""))}
function statusPill(f){
  if(!f)return `<span class="pill na">Sin fichas</span>`;
  if(f.estado==="abierta")return `<span class="pill info">En taller</span>`;
  const r=resumen(f);
  if(r.M)return `<span class="pill bad">${r.M} ítem(s) malo(s)</span>`;
  if(r.R)return `<span class="pill warn">${r.R} regular(es)</span>`;
  return `<span class="pill ok">En condiciones</span>`;
}

document.getElementById("salir").onclick=()=>salir();
/* ===== Navegación ===== */
const state={view:"flota",fichaId:null,q:"",filtroCamion:"",filtroEstado:""};
function go(view,opts={}){Object.assign(state,{view},opts);if(view!=="editor"){try{history.replaceState(null,"","#"+view)}catch(e){}}render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.view==="historial")state.filtroCamion="";go(b.dataset.view)}));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h==="flota"||h==="historial"||h==="alertas")go(h)});

function render(fromSync){
  if(fromSync&&state.view==="editor")return; // no pisar lo que se está escribiendo
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===state.view||(state.view==="editor"&&b.dataset.view==="historial")||(state.view==="camion"&&b.dataset.view==="flota"))));
  $("#bar").innerHTML="";
  const ph=pendientesHoy(),bd=$("#badge");if(bd){bd.hidden=!ph.total;bd.textContent=ph.total}
  if(state.view==="flota")renderFlota();
  else if(state.view==="historial")renderHistorial();
  else if(state.view==="alertas")renderAlertas();
  else if(state.view==="camion")renderCamion();
  else renderEditor();
}

/* ===== Vista: Flota ===== */
const byUmc=(a,b)=>String(a.umc||a.patente||"").localeCompare(String(b.umc||b.patente||""),"es",{numeric:true});
function renderFlota(){
  const q=state.q.toLowerCase();
  const todos=Store.list("camiones");const tiposPres=[...new Set(todos.map(c=>c.tipo).filter(Boolean))].sort((a,b)=>TIPOS.indexOf(a)-TIPOS.indexOf(b));
  const cams=todos.filter(c=>(!state.tipo||c.tipo===state.tipo)&&(!q||[c.umc,c.patente,c.marca,c.modelo,c.tipo].join(" ").toLowerCase().includes(q))).sort(byUmc);

/* ===== Importar flota desde planilla (Excel / CSV) ===== */
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const ALIAS={umc:["umc","movil","nmovil","nromovil","numerodemovil","interno","ninterno","unidad","nombre","nombremovil"],
  patente:["patente","placa","dominio","patenteplaca","matricula"],marca:["marca"],modelo:["modelo"],anio:["ano","anio","year","anofabricacion","modeloano"],
  chasis:["chasis","nchasis","nrochasis","numerodechasis","numerochasis","vin"],
  tipo:["tipo","tipodeunidad","tipounidad","categoria","clase"],combustible:["combustible","tipocombustible"],
  propietario:["propietario","dueno","titular"],aseguradora:["aseguradora","seguro","compania","companiaseguro"]};
const IGNORAR=["color","motor","nmotor","nromotor","numerodemotor","numeromotor"];
const ALIAS_IDX={};Object.entries(ALIAS).forEach(([k,a])=>a.forEach(x=>ALIAS_IDX[x]=k));
function pickSheet(){const i=$("#sheetIn");i.value="";i.onchange=()=>{const f=i.files[0];if(f)leerPlanilla(f)};i.click()}
function parseCSV(t){const sep=(t.split("\n")[0].match(/;/g)||[]).length>(t.split("\n")[0].match(/,/g)||[]).length?";":",";const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'&&t[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=""}else if(ch==="\n"){row.push(cur.replace(/\r$/,""));rows.push(row);row=[];cur=""}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows}
async function leerPlanilla(file){
  let rows;
  try{
    if(/\.csv$/i.test(file.name)||file.type==="text/csv")rows=parseCSV(await file.text());
    else{if(!window.XLSX){toast("Para leer Excel hace falta internet. Sin conexión, guardá la planilla como CSV.");return}
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""})}
  }catch(e){toast("No se pudo leer el archivo");return}
  rows=rows.filter(r=>r.some(v=>String(v).trim()!==""));
  // buscar la fila de encabezados (la primera que tenga UMC o patente)
  let hi=rows.findIndex(r=>r.some(v=>["umc","patente","placa","dominio","movil","interno"].includes(norm(v))));if(hi<0)hi=0;
  const head=rows[hi]||[],body=rows.slice(hi+1);
  const map=head.map(h=>ALIAS_IDX[norm(h)]||null);
  if(!map.includes("umc")){toast("La planilla necesita una columna UMC");return}
  const desconocidas=head.filter((h,i)=>!map[i]&&String(h).trim()&&!IGNORAR.includes(norm(h)));
  const existentes={};Store.list("camiones").forEach(c=>{if(c.umc)existentes[String(c.umc).trim().toLowerCase()]=c});
  const nuevos=[],act=[],omit=[];const vistos=new Set();
  body.forEach((r,ri)=>{
    const o={otros:{}};head.forEach((h,i)=>{const v=String(r[i]??"").trim();if(map[i])o[map[i]]=v;else if(String(h).trim()&&v&&!IGNORAR.includes(norm(h)))o.otros[String(h).trim()]=v});
    if(!o.umc){omit.push(ri+hi+2);return}
    const key=o.umc.toLowerCase();if(vistos.has(key)){omit.push(ri+hi+2);return}vistos.add(key);
    if(o.patente)o.patente=o.patente.toUpperCase();
    if(o.tipo){const t=TIPO_ALIAS[norm(o.tipo)]||TIPOS.find(x=>norm(x)===norm(o.tipo));if(t)o.tipo=t}
    if(o.combustible){const t=COMBUSTIBLES.find(x=>norm(x)===norm(o.combustible));if(t)o.combustible=t}
    const ex=existentes[key];
    if(ex)act.push({...ex,...Object.fromEntries(Object.entries(o).filter(([k,v])=>k!=="otros"&&v!=="")),otros:{...(ex.otros||{}),...o.otros}});
    else nuevos.push({id:uid("c"),umc:"",patente:"",marca:"",modelo:"",anio:"",tipo:"",chasis:"",combustible:"",propietario:"",aseguradora:"",...o});
  });
  const cols=[...new Set(map.filter(Boolean))];
  const prev=[...nuevos,...act].slice(0,10);
  $("#layer").innerHTML=`<div class="overlay"><div class="modal" style="max-width:980px"><h2>Importar flota</h2>
    <p style="margin:0"><b>${esc(file.name)}</b>: <b>${nuevos.length}</b> UMC nuevos, <b>${act.length}</b> se actualizan${omit.length?`, <b>${omit.length}</b> filas omitidas (sin UMC o repetidas: fila ${omit.slice(0,8).join(", ")}${omit.length>8?"…":""})`:""}.</p>
    <p class="muted" style="margin:0">Columnas reconocidas: ${cols.map(k=>(CAMPOS.find(c=>c[0]===k)||[0,k])[1]).join(", ")}.${desconocidas.length?` Columnas extra que se guardan como "otros datos": ${desconocidas.map(esc).join(", ")}.`:""}</p>
    <div class="tablebox prev"><table><thead><tr>${cols.map(k=>`<th>${esc((CAMPOS.find(c=>c[0]===k)||[0,k])[1])}</th>`).join("")}<th>Estado</th></tr></thead><tbody>${prev.map(c=>`<tr>${cols.map(k=>`<td>${esc(c[k])}</td>`).join("")}<td>${nuevos.includes(c)?`<span class="pill ok">Nuevo</span>`:`<span class="pill info">Actualiza</span>`}</td></tr>`).join("")}</tbody></table></div>
    ${nuevos.length+act.length>10?`<span class="muted">Se muestran 10 de ${nuevos.length+act.length}.</span>`:""}
    <div class="row" style="justify-content:flex-end"><button class="btn" id="icancel">Cancelar</button><button class="btn primary" id="iok" ${nuevos.length+act.length?"":"disabled"}>Importar ${nuevos.length+act.length} camiones</button></div></div></div>`;
  $("#icancel").onclick=()=>$("#layer").innerHTML="";
  $("#iok").onclick=()=>{[...nuevos,...act].forEach(c=>{delete c.ejemplo;Store.save("camiones",c)});$("#layer").innerHTML="";render();toast(`Flota importada: ${nuevos.length} nuevos, ${act.length} actualizados`)};
}

async function guardarArchivo(filename,data,type){

/* ===== Alertas y control periódico ===== */
const AJ_DEF={diasM:3,diasR:7,frecuencia:30,avisoAntes:3};
function ajustes(){return {...AJ_DEF,...(Store.get("config","ajustes")||{})}}
const addDays=(s,n)=>{const d=new Date((s||today())+"T12:00:00");d.setDate(d.getDate()+Number(n||0));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const diffDays=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const haceTxt=n=>n<=0?"hoy":n===1?"hace 1 día":`hace ${n} días`;
function alertasAbiertas(cid){return Store.list("alertas").filter(a=>a.estado==="abierta"&&(!cid||a.camionId===cid))}
const alertaVencida=a=>a.estado==="abierta"&&(a.proximoAviso||"")<=today();
function avisoN(a){return 1+Math.floor(Math.max(0,diffDays(a.detectada,today()))/Math.max(1,a.cadaDias||1))}
function ultimoControl(cid){return fichasDe(cid).find(f=>f.estado==="cerrada")}
function controlInfo(c){
  const aj=ajustes(),freq=Number(c.frecuencia)||aj.frecuencia,u=ultimoControl(c.id);
  if(!u)return {estado:"sin",txt:"Sin controles",prox:null,freq};
  const prox=addDays(u.fechaEntrada,freq),d=diffDays(today(),prox);
  if(d<0)return {estado:"vencido",txt:`Control vencido ${haceTxt(-d)}`,prox,freq,d};
  if(d<=aj.avisoAntes)return {estado:"pronto",txt:d===0?"Control vence hoy":`Control vence en ${d} día${d>1?"s":""}`,prox,freq,d};
  return {estado:"ok",txt:`Próximo control ${fdate(prox)}`,prox,freq,d};
}
function controlPill(ci){return `<span class="pill ${ci.estado==="vencido"?"bad":ci.estado==="pronto"?"warn":ci.estado==="sin"?"na":"ok"}">${esc(ci.txt)}</span>`}
function pendientesHoy(){
  const al=Store.list("alertas").filter(alertaVencida).length;
  const ct=Store.list("camiones").filter(c=>{const s=controlInfo(c).estado;return s==="vencido"||s==="pronto"}).length;
  return {al,ct,total:al+ct};
}
/* Al cerrar una ficha: crea, repite o resuelve alertas según el estado de cada ítem */
function generarAlertas(f){
  const aj=ajustes(),hoy=today(),base=f.fechaEntrada||today();let nuevas=0,resueltas=0,repetidas=0;
  const abiertas=alertasAbiertas(f.camionId);
  keysOf(f).forEach(k=>{
    const it=f.items[k]||{},est=it.estado,ab=abiertas.find(a=>a.item===k);
    const nombre=itemNombreDe(f,k).replace(/^\d+\.\s*/,"");
    if(est==="R"||est==="M"){
      const dias=est==="M"?aj.diasM:aj.diasR;
      if(ab){const a=JSON.parse(JSON.stringify(ab));a.nivel=est==="M"||a.nivel==="M"?"M":"R";a.obs=it.obs||a.obs;
        a.seguimiento.push({fecha:base,tipo:"repetida",texto:`Sigue ${EST_LABEL[est]} en ficha N° ${f.numero}${it.obs?": "+it.obs:""}`});
        if(!a.proximoAviso||a.proximoAviso>addDays(base,dias))a.proximoAviso=addDays(base,dias);Store.save("alertas",a);repetidas++}
      else{Store.save("alertas",{id:uid("a"),camionId:f.camionId,umc:f.vehiculo.umc||"",patente:f.vehiculo.patente||"",item:k,nombre,nivel:est,obs:it.obs||"",
        fichaId:f.id,fichaNumero:f.numero,detectada:f.fechaEntrada||hoy,cadaDias:dias,proximoAviso:addDays(base,dias),estado:"abierta",
        seguimiento:[{fecha:f.fechaEntrada||hoy,tipo:"detectada",texto:`Detectado ${EST_LABEL[est]} en ficha N° ${f.numero}${it.obs?": "+it.obs:""}`}]});nuevas++}
    }else if(est==="B"&&ab){const a=JSON.parse(JSON.stringify(ab));a.estado="resuelta";a.resuelta={fecha:base,texto:`Marcado Bueno en ficha N° ${f.numero}`};
      a.seguimiento.push({fecha:base,tipo:"resuelta",texto:a.resuelta.texto});Store.save("alertas",a);resueltas++}
  });
  return {nuevas,resueltas,repetidas};
}
function alertaCard(a){
  const venc=alertaVencida(a),c=Store.get("camiones",a.camionId)||{};
  const d=diffDays(a.detectada,today());
  return `<article class="alerta ${a.estado==="resuelta"?"done":a.nivel==="M"?"m":"r"}">
    <div class="al-umc"><span class="lbl">UMC</span><span class="umc">${esc(c.umc||a.umc)}</span><span class="plate sm">${esc(c.patente||a.patente)}</span></div>
    <div class="al-body"><div class="row" style="gap:8px"><strong style="font-size:18px">${esc(a.nombre)}</strong>${a.estado==="resuelta"?`<span class="pill ok">Resuelta ${fdate(a.resuelta&&a.resuelta.fecha)}</span>`:`<span class="pill ${a.nivel==="M"?"bad":"warn"}">${EST_LABEL[a.nivel]}</span>${venc?`<span class="pill bad">Aviso N° ${avisoN(a)}</span>`:""}`}</div>
      ${a.obs?`<div>${esc(a.obs)}</div>`:""}
      <div class="muted" style="font-size:14px">Detectada ${fdate(a.detectada)} (${haceTxt(d)}) · ficha N° <span class="mono">${esc(a.fichaNumero)}</span>${a.estado==="abierta"?` · aviso cada ${a.cadaDias} día${a.cadaDias>1?"s":""} · ${venc?"<b>para revisar hoy</b>":"próximo aviso "+fdate(a.proximoAviso)}`:""}</div></div>
    <div class="al-act"><button class="btn ${a.estado==="abierta"?"primary":""}" data-alerta="${a.id}">${a.estado==="abierta"?"Atender":"Ver"}</button></div></article>`;
}

function wireAlertas(){document.querySelectorAll("[data-alerta]").forEach(b=>b.onclick=()=>alertaModal(b.dataset.alerta))}

  const all=Store.list("alertas"),hoy=today();

  const res=all.filter(a=>a.estado==="resuelta").sort((a,b)=>(b.resuelta&&b.resuelta.fecha||"").localeCompare(a.resuelta&&a.resuelta.fecha||"")).slice(0,15);

  <p class="muted" style="margin:0">Cada ítem marcado <b>M</b> avisa cada ${aj.diasM} días y cada <b>R</b> cada ${aj.diasR} días, hasta que se marca como hecho o vuelve a salir Bueno en un control. El control de cada camión vence a los ${aj.frecuencia} días.</p>
  <section class="card"><h3>Para revisar hoy</h3>${venc.length?`<div class="alist">${venc.map(alertaCard).join("")}</div>`:`<p class="muted" style="margin:0">Nada pendiente para hoy.</p>`}</section>
  <section class="card"><h3>Controles periódicos</h3>${ctrl.length?`<div class="alist">${ctrl.map(({c,ci})=>`<article class="alerta ${ci.estado==="vencido"?"m":ci.estado==="pronto"?"r":""}"><div class="al-umc"><span class="lbl">UMC</span><span class="umc">${esc(c.umc)}</span><span class="plate sm">${esc(c.patente)}</span></div><div class="al-body">${controlPill(ci)}<span class="muted" style="font-size:14px">${ci.prox?`Último control ${fdate(ultimoControl(c.id).fechaEntrada)} · cada ${ci.freq} días`:"Todavía no tiene ningún control cerrado"}</span></div><div class="al-act"><button class="btn primary" data-nueva="${c.id}">Hacer control</button></div></article>`).join("")}</div>`:`<p class="muted" style="margin:0">Ningún control vencido ni por vencer.</p>`}${sinCtrl?`<p class="muted" style="margin:0">${sinCtrl} móvil${sinCtrl>1?"es":""} todavía sin ningún control cerrado.</p>`:""}</section>
  <section class="card"><h3>En seguimiento</h3>${seg.length?`<div class="alist">${seg.map(alertaCard).join("")}</div>`:`<p class="muted" style="margin:0">No hay alertas esperando el próximo aviso.</p>`}</section>
  ${res.length?`<section class="card"><h3>Resueltas recientemente</h3><div class="alist">${res.map(alertaCard).join("")}</div></section>`:""}`;
  wireAlertas();$("#cfgAj").onclick=ajustesModal;

function abrirFicha(cid){const c=Store.get("camiones",cid);if(!c)return;const ab=fichasDe(cid).find(f=>f.estado==="abierta");if(ab){go("editor",{fichaId:ab.id});return}const f=newFicha(c);Store.save("fichas",f);go("editor",{fichaId:f.id})}
function ajustesModal(){
  const aj=ajustes();const num=(k,l,h)=>`<div class="f"><label for="aj-${k}">${l}</label><input id="aj-${k}" type="number" min="1" max="365" value="${aj[k]}"><span class="muted" style="font-size:13px">${h}</span></div>`;
  $("#layer").innerHTML=`<div class="overlay"><form class="modal" id="ajf"><h2>Ajustes de avisos</h2><div class="fields">
    ${num("diasM","Ítem Malo: avisar cada (días)","Hasta que se resuelva")}${num("diasR","Ítem Regular: avisar cada (días)","Hasta que se resuelva")}
    ${num("frecuencia","Control de cada camión cada (días)","Se puede cambiar por camión")}${num("avisoAntes","Avisar antes del vencimiento (días)","Aparece como 'por vencer'")}</div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="ajx">Cancelar</button><button class="btn primary">Guardar</button></div></form></div>`;

/* ===== Vista: seguimiento de un camión ===== */
function renderCamion(){
  const c=Store.get("camiones",state.camionId);if(!c){go("flota");return}
  const ci=controlInfo(c),fs=fichasDe(c.id),cerr=fs.filter(f=>f.estado==="cerrada").slice(0,12).reverse();
  const al=Store.list("alertas").filter(a=>a.camionId===c.id);
  const ab=al.filter(a=>a.estado==="abierta"),rs=al.filter(a=>a.estado==="resuelta").sort((a,b)=>(b.resuelta.fecha||"").localeCompare(a.resuelta.fecha||""));
  // ítems a mostrar en la evolución
  const nombres={};cerr.forEach(f=>keysOf(f).forEach(k=>{if(!nombres[k])nombres[k]=itemNombreDe(f,k)}));
  let keys=Object.keys(nombres);if(!state.todos)keys=keys.filter(k=>cerr.some(f=>["R","M"].includes((f.items[k]||{}).estado)));
  const rk=k=>k==="40"?2e3:/^\d+$/.test(k)?+k:1e3;keys.sort((a,b)=>rk(a)-rk(b));
  $("#main").innerHTML=`<div class="edhead"><button class="btn ghost" id="back">← Flota</button><h2>UMC ${esc(c.umc)}</h2><span class="plate">${esc(c.patente)}</span><span class="tchip" style="${tc(c.tipo)}">${esc(c.tipo||"")}</span><span class="muted">${esc([c.marca,c.modelo,c.anio].filter(Boolean).join(" "))}</span></div>
  <div class="row">${controlPill(ci)}<div class="f" style="flex-direction:row;align-items:center;gap:8px"><label for="freq" class="lbl">Control cada</label><select id="freq" style="min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 10px">${[7,10,15,20,30,45,60].map(n=>`<option value="${n}" ${ci.freq===n?"selected":""}>${n} días</option>`).join("")}</select></div><span style="flex:1"></span><button class="btn primary" id="hacer">${fs[0]&&fs[0].estado==="abierta"?"Continuar ficha":"Hacer control"}</button></div>
  <section class="card"><h3>Alertas abiertas (${ab.length})</h3>${ab.length?`<div class="alist">${ab.map(alertaCard).join("")}</div>`:`<p class="muted" style="margin:0">Sin alertas abiertas.</p>`}</section>
  <section class="card"><h3>Evolución por ítem</h3>
    ${cerr.length?`<div class="row"><label class="chk"><input type="checkbox" id="todos" ${state.todos?"checked":""}> Ver todos los ítems (si no, solo los que alguna vez dieron R o M)</label></div>
    ${keys.length?`<div class="tablebox"><table class="matrix"><thead><tr><th>Ítem</th>${cerr.map(f=>`<th class="mono" title="Ficha N° ${esc(f.numero)}">${fdate(f.fechaEntrada).slice(0,5)}</th>`).join("")}</tr></thead><tbody>
    ${keys.map(k=>`<tr><td class="iname">${esc(nombres[k])}</td>${cerr.map(f=>{const e=(f.items[k]||{}).estado||"";return `<td><span class="cell c${e}" title="${esc((f.items[k]||{}).obs||"")}">${e==="NA"?"–":e||"·"}</span></td>`}).join("")}</tr>`).join("")}
    </tbody></table></div>`:`<p class="muted" style="margin:0">Ningún ítem dio R o M en los últimos controles.</p>`}`:`<p class="muted" style="margin:0">La evolución aparece cuando haya controles cerrados.</p>`}
  </section>
  <section class="card"><h3>Controles (${fs.length})</h3>${fs.length?`<div class="tablebox"><table><thead><tr><th>N° ficha</th><th>Fecha</th><th>Km</th><th>Resultado</th><th>Estado</th></tr></thead><tbody>${fs.map(f=>{const r=resumen(f);return `<tr data-id="${f.id}"><td class="mono">${esc(f.numero)}</td><td class="mono">${fdate(f.fechaEntrada)}</td><td class="mono">${esc(f.km||"—")}</td><td><span class="pill ok">${r.B} B</span> <span class="pill warn">${r.R} R</span> <span class="pill bad">${r.M} M</span></td><td>${f.estado==="abierta"?`<span class="pill info">Abierta</span>`:`<span class="pill na">Cerrada</span>`}</td></tr>`}).join("")}</tbody></table></div>`:`<p class="muted" style="margin:0">Todavía no hay controles.</p>`}</section>
  ${rs.length?`<section class="card"><h3>Alertas resueltas (${rs.length})</h3><div class="alist">${rs.map(alertaCard).join("")}</div></section>`:""}`;
  $("#back").onclick=()=>go("flota");$("#hacer").onclick=()=>abrirFicha(c.id);
  $("#freq").onchange=e=>{const x=JSON.parse(JSON.stringify(c));x.frecuencia=+e.target.value;Store.save("camiones",x);renderCamion();toast("Frecuencia guardada")};
  const t=$("#todos");if(t)t.onchange=()=>{state.todos=t.checked;renderCamion()};
  wireAlertas();document.querySelectorAll("tbody tr[data-id]").forEach(tr=>tr.onclick=()=>go("editor",{fichaId:tr.dataset.id}));
}
function itemNombreDe(f,k){const ex=(f&&f.extras)||[];if(k==="40")return (40+ex.length)+". "+ITEMS[39];if(/^\d+$/.test(k))return k+". "+ITEMS[+k-1];const i=ex.findIndex(x=>x.id===k);return i<0?k:(40+i)+". "+ex[i].nombre}

/* ===== Vista: historial de fichas ===== */
function renderHistorial(){
  let fs=Store.list("fichas");
  if(state.filtroCamion)fs=fs.filter(f=>f.camionId===state.filtroCamion);
  if(state.filtroEstado)fs=fs.filter(f=>f.estado===state.filtroEstado);
  fs.sort((a,b)=>(b.numero||"").localeCompare(a.numero||""));
  const cams=Store.list("camiones").sort(byUmc);
  $("#main").innerHTML=`<div class="row"><h2 style="font-size:30px;margin-right:auto">Fichas de control</h2></div>
    <div class="row"><div class="f" style="min-width:220px"><label for="fc">Camión</label><select id="fc"><option value="">Todos</option>${cams.map(c=>`<option value="${c.id}" ${state.filtroCamion===c.id?"selected":""}>UMC ${esc(c.umc)} · ${esc(c.patente)} · ${esc(c.marca)} ${esc(c.modelo)}</option>`).join("")}</select></div>
    <div class="f" style="min-width:180px"><label for="fe">Estado</label><select id="fe"><option value="">Todas</option><option value="abierta" ${state.filtroEstado==="abierta"?"selected":""}>Abiertas (en taller)</option><option value="cerrada" ${state.filtroEstado==="cerrada"?"selected":""}>Cerradas</option></select></div></div>
    ${fs.length?`<div class="tablebox"><table><thead><tr><th>N° ficha</th><th>UMC</th><th>Patente</th><th>Tipo</th><th>Entrada</th><th>Salida</th><th>Km</th><th>Resultado</th><th>Estado</th></tr></thead><tbody>
    ${fs.map(f=>{const r=resumen(f);return `<tr data-id="${f.id}"><td class="mono">${esc(f.numero)}${f.ejemplo?` <span class="ex">Ejemplo</span>`:""}</td><td><b class="umc" style="font-size:20px">${esc(f.vehiculo&&f.vehiculo.umc)}</b></td><td class="mono">${esc(f.vehiculo&&f.vehiculo.patente)}</td><td>${esc(f.vehiculo&&f.vehiculo.tipo)}</td><td class="mono">${fdate(f.fechaEntrada)}</td><td class="mono">${fdate(f.fechaSalida)}</td><td class="mono">${esc(f.km||"—")}</td>
      <td><span class="pill ok">${r.B} B</span> <span class="pill warn">${r.R} R</span> <span class="pill bad">${r.M} M</span></td><td>${f.estado==="abierta"?`<span class="pill info">Abierta</span>`:`<span class="pill na">Cerrada</span>`}</td></tr>`}).join("")}
    </tbody></table></div>`:`<div class="empty"><strong>No hay fichas con este filtro</strong><span class="muted">Las fichas se crean desde la tarjeta de cada camión, en la pestaña Flota.</span></div>`}`;
  $("#fc").onchange=e=>{state.filtroCamion=e.target.value;renderHistorial()};
  $("#fe").onchange=e=>{state.filtroEstado=e.target.value;renderHistorial()};
  document.querySelectorAll("tbody tr[data-id]").forEach(tr=>tr.onclick=()=>go("editor",{fichaId:tr.dataset.id}));
}

/* ===== Vista: editor de ficha ===== */
let F=null,saveT=null,dirty=false;
function scheduleSave(){dirty=true;clearTimeout(saveT);saveT=setTimeout(saveNow,700);updateBar()}
function saveNow(){clearTimeout(saveT);if(F&&dirty){Store.save("fichas",JSON.parse(JSON.stringify(F)));dirty=false;updateBar()}}
window.addEventListener("pagehide",saveNow);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveNow()});

function renderEditor(){
  const src=Store.get("fichas",state.fichaId);
  if(!src){go("historial");return}
  F=JSON.parse(JSON.stringify(src));
  if(F.estado==="abierta"){const pl=plantilla();let ch=false;F.extras=F.extras||[];
    pl.forEach(x=>{if(!F.extras.some(e=>e.id===x.id)){F.extras.push({id:x.id,nombre:x.nombre});F.items[x.id]=F.items[x.id]||{estado:"",obs:""};ch=true}});
    F.extras=F.extras.filter(e=>{const keep=pl.some(x=>x.id===e.id)||((F.items[e.id]||{}).estado);if(!keep){delete F.items[e.id];ch=true}return keep});
    F.extras.forEach(e=>{const t=pl.find(x=>x.id===e.id);if(t&&t.nombre!==e.nombre){e.nombre=t.nombre;ch=true}});
    if(ch){dirty=true;setTimeout(saveNow,0)}}
  const ro=F.estado==="cerrada";
  const v=F.vehiculo||{};
  const inp=(path,label,type="text",cls="")=>`<div class="f ${cls}"><label for="i-${path}">${label}</label><input id="i-${path}" data-path="${path}" type="${type}" value="${esc(getP(path))}"></div>`;
  const ta=(path,label)=>`<div class="f wide"><label for="i-${path}">${label}</label><textarea id="i-${path}" data-path="${path}">${esc(getP(path))}</textarea></div>`;
  const seg=(path,label,opts)=>`<div class="f"><span class="lbl">${label}</span><div class="seg" data-seg="${path}">${opts.map(o=>`<button type="button" data-v="${o}" aria-pressed="${getP(path)===o}">${o}</button>`).join("")}</div></div>`;

function setupCanvas(k){

  const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*dpr);cv.height=120*dpr;
  const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.lineWidth=2.2*dpr;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#10202b";
  let drawing=false,drew=false;

  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y)};

    ${window.top===window?`<button class="btn" id="print" type="button">Imprimir</button>`:""}
    ${ro?"":`<button class="btn primary" id="close" type="button">Cerrar ficha</button>`}</div></div>`;
  const p=$("#print");if(p)p.onclick=()=>{saveNow();window.print()};
  const c=$("#close");if(c)c.onclick=cerrarFicha;
  updateBar();
}
function updateBar(){const b=$("#bstat");if(!b||!F)return;const r=resumen(F);b.innerHTML=`<b class="mono">${r.done}/${r.total}</b> ítems revisados · ${dirty?"Guardando…":"Guardado"}`}
function cerrarFicha(){
  const faltan=keysOf(F).filter(n=>!F.items[n].estado);
  const sinObs=keysOf(F).filter(needs);
  if(faltan.length||sinObs.length){
    const n=faltan[0]||sinObs[0];
    toast(faltan.length?`Faltan ${faltan.length} ítem(s) sin estado (ej.: ${itemNombre(faltan[0])})`:`${itemNombre(sinObs[0])}: R o M necesita observación`);
    const el=document.getElementById("it-"+n);if(el){el.scrollIntoView({behavior:"smooth",block:"center"})}return;
  }
  confirmar("¿Cerrar la ficha? Quedará en modo lectura (se puede reabrir).","Cerrar ficha",()=>{
    F.estado="cerrada";if(!F.fechaSalida)F.fechaSalida=today();dirty=true;saveNow();
    const g=generarAlertas(F);render();
    toast("Ficha cerrada"+(g.nuevas?` · ${g.nuevas} alerta(s) nueva(s)`:"")+(g.repetidas?` · ${g.repetidas} siguen pendientes`:"")+(g.resueltas?` · ${g.resueltas} resuelta(s)`:""));window.scrollTo(0,0)});
}

/* ===== Respaldo ===== */
async function exportar(){
  const fichas=Store.list("fichas");const fotosData={};
  for(const f of fichas)for(const ph of (f.fotos||[]))if(!ph.nube){try{const d=await Fotos.toDataURL(ph.id);if(d)fotosData[ph.id]=d}catch(e){}}
  const json=JSON.stringify({app:"ficha-taller",version:2,exportado:new Date().toISOString(),camiones:Store.list("camiones"),fichas,config:Store.list("config"),alertas:Store.list("alertas"),fotosData});
  await guardarArchivo(`respaldo-flota-${today()}.json`,json,"application/json");
}
function importar(e){
  const file=e.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.camiones)||!Array.isArray(d.fichas))throw 0;
    confirmar(`Importar ${d.camiones.length} camión(es) y ${d.fichas.length} ficha(s)? Los registros con el mismo identificador se reemplazan.`,"Importar",async()=>{
      for(const [id,u] of Object.entries(d.fotosData||{})){try{await Fotos.fromDataURL(id,u)}catch(e){}}
      d.camiones.forEach(c=>c.id&&Store.save("camiones",c));d.fichas.forEach(f=>f.id&&Store.save("fichas",f));(d.config||[]).forEach(c=>c.id&&Store.save("config",c));(d.alertas||[]).forEach(a=>a.id&&Store.save("alertas",a));render();toast("Respaldo importado")})}
    catch(err){toast("El archivo no es un respaldo válido")}};
  rd.readAsText(file);e.target.value="";
}

/* ===== Inicio ===== */
const h=location.hash.slice(1);if(h==="historial"||h==="alertas")state.view=h;
render();
Store.init();
})();
</script>

<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
