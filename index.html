.ph input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;min-height:40px;width:100%;font-size:14px}
.addph{border:2px dashed var(--line);border-radius:8px;aspect-ratio:4/3;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;color:var(--accent);max-width:100%}
.addph span{font-size:34px;line-height:1}
.big{max-width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:#000}
.additem{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:10px}
.additem input[type=text]{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;min-height:46px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.chk input{width:22px;height:22px}
.qx{border:0;background:none;color:var(--bad);font:inherit;font-size:12px;font-weight:700;padding:2px 4px;margin-left:4px;cursor:pointer;text-decoration:underline}
.xtra{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.prev{max-height:340px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-left:4px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;width:100%;text-align:left;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:14px 16px;font-size:17px;min-height:52px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:30px;line-height:1.1}.tile span{color:var(--muted);font-size:14px}
.tile{border-top:5px solid var(--accent)}.tile.bad{border-color:var(--bad);background:var(--bad-soft)}.tile.bad b{color:var(--bad)}
.alist{display:flex;flex-direction:column;gap:10px}
.alerta{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);min-width:0}
.alerta.m{border-left-color:var(--bad)}.alerta.r{border-left-color:var(--warn)}.alerta.done{border-left-color:var(--ok);opacity:.85}
.al-umc{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.al-body{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.tl{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tl li.resuelta{color:var(--ok);font-weight:600}.tl li.detectada{color:var(--bad)}
.matrix th,.matrix td{text-align:center;padding:6px}.matrix th:first-child{text-align:left}.matrix td.iname{text-align:left;white-space:normal;min-width:220px;font-size:14px}
.cell{display:inline-grid;place-items:center;width:30px;height:28px;border-radius:6px;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted)}
.cell.cB{background:var(--ok-soft);color:var(--ok)}.cell.cR{background:var(--warn);color:var(--surface)}.cell.cM{background:var(--bad);color:var(--surface)}
@media (max-width:640px){.alerta{grid-template-columns:1fr}.al-umc{flex-direction:row;align-items:center;gap:8px}}
@media (max-width:560px){.checks{grid-template-columns:1fr}.item{grid-template-columns:28px 1fr}.item .est{grid-column:2/-1}.brand h1{font-size:18px}.brand img{height:34px}.brand .bt{display:none}.est button{width:42px}.est button.na{width:48px}.secnav{top:calc(env(safe-area-inset-top,0px) + 110px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.bar,.secnav,.noprint{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;border-color:#999}}
</style>

<script>
(function(){

/* ===== Ítems de la planilla (Ficha de Control de Taller) ===== */

const MIXER_ONLY=[28,29,30,39];
const TIPOS=["Mixer","Camión","Tracto-camión","Semirremolque","Pluma","Vehículo liviano","Mediano","Pequeño"];
const TIPO_COLOR={"Mixer":"--t-mixer","Camión":"--t-camion","Tracto-camión":"--t-tracto","Semirremolque":"--t-semi","Pluma":"--t-pluma","Vehículo liviano":"--t-liviano"};
const tc=t=>`--tc:var(${TIPO_COLOR[t]||"--t-otro"})`;
const TIPO_ALIAS={semiremolque:"Semirremolque",semirremolque:"Semirremolque",tractocamion:"Tracto-camión",tractor:"Tracto-camión",vehiculoliviano:"Vehículo liviano",liviano:"Vehículo liviano",camion:"Camión",mixer:"Mixer",hormigonera:"Mixer",pluma:"Pluma"};

const NIVELES=["Lleno","3/4","1/2","1/4"];
const TIPOS_MANT=["Menor","Mayor","Preventivo","Correctivo"];

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fdate=s=>{if(!s)return"—";const [y,m,d]=s.split("-");return d&&m&&y?`${d}/${m}/${y}`:s};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const money=n=>n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let toastT;function toast(msg){const l=document.getElementById("toastbox")||Object.assign(document.body.appendChild(document.createElement("div")),{id:"toastbox"});l.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>l.innerHTML="",2600)}

/* ===== Almacenamiento: nube compartida si está disponible, si no, este dispositivo ===== */
const Store={
  mode:(window.claude?"init":"local"), db:null,
  data:Object.assign({camiones:{},fichas:{},config:{},alertas:{}},lsGet("sjc.cache",{})),
  pending:lsGet("sjc.pending",[]),
  persist(){if(!this.fb)lsSet("sjc.cache",this.data);lsSet("sjc.pending",this.pending)},
  list(col){return Object.values(this.data[col]||{})},
  get(col,id){return (this.data[col]||{})[id]},
  save(col,obj){obj.actualizado=new Date().toISOString();this.data[col][obj.id]=obj;this.queue({op:"set",col,id:obj.id,obj});},
  remove(col,id){delete this.data[col][id];this.queue({op:"del",col,id});},
  queue(w){if(this.mode!=="local"){this.pending=this.pending.filter(p=>!(p.col===w.col&&p.id===w.id));this.pending.push(w)}this.persist();this.flush();},
  flushing:false,
  async flush(){
    if(!this.db||this.flushing)return;this.flushing=true;
    while(this.pending.length){
      const w=this.pending[0];
      try{const ref=this.db.collection(w.col).doc(w.id);w.op==="set"?await ref.set(w.obj):await ref.delete();this.pending.shift();this.persist();}
      catch(e){if(e&&e.code==="permission-denied"){this.pending.shift();this.persist();toast("Ese cambio solo lo puede hacer el administrador");continue}setSync();break;}
    }
    this.flushing=false;setSync();
  },
  async init(){
    let db=null;
    if(window.FIREBASE_CONFIG){db=await initFirebase();if(!db)return;this.fb=true}
    else try{if(window.claude&&typeof window.claude.use==="function")db=await window.claude.use("db")}catch(e){db=null}
    if(!db){this.mode="local";setSync();render();return}
    this.db=db;this.mode="nube";setSync();
    if(this.fb){this.assets=null;["camiones","fichas","config","alertas"].forEach(col=>this.listen(db,col));this.flush();window.addEventListener("online",()=>this.flush());setInterval(()=>{if(this.pending.length)this.flush()},20000);return}
    try{this.assets=await window.claude.use("assets")}catch(e){this.assets=null}
    ["camiones","fichas","config","alertas"].forEach(col=>this.listen(db,col));
    this.flush();
    window.addEventListener("online",()=>this.flush());
    setInterval(()=>{if(this.pending.length)this.flush()},20000);
  },
  loaded:{}, assets:null, fb:false, user:"",
  listen(db,col){
      db.collection(col).onSnapshot(snap=>{
        const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]={...d.data(),id:d.id}});
        this.pending.forEach(p=>{if(p.col!==col)return;if(p.op==="set")next[p.id]=p.obj;else delete next[p.id]});
        this.data[col]=next;this.loaded[col]=true;this.persist();render(true);
      },err=>{toast("No se pudo leer la base: "+(err&&err.message||"error"));});
      }
};

/* ===== Fotos: nube (assets) o esta tablet (IndexedDB) ===== */
const Fotos={
  _db:null,urls:{},
  idb(){if(this._db)return this._db;this._db=new Promise((res,rej)=>{try{const r=indexedDB.open("sjc-fotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this._db},
  async idbDo(mode,fn){const db=await this.idb();return new Promise((res,rej)=>{const tx=db.transaction("f",mode);const q=fn(tx.objectStore("f"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})},
  async compress(file){
    const url=URL.createObjectURL(file);
    try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const max=1600,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",0.75));
    }finally{URL.revokeObjectURL(url)}
  },
  async add(file){
    const blob=await this.compress(file);
    if(Store.fb&&Store.fs){const id=uid("p");try{await this.idbDo("readwrite",s=>s.put(blob,id))}catch(e){}
      let data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
      if(data.length>900000){const im=await createImageBitmap(blob);const c=document.createElement("canvas");const k=Math.min(1,1100/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);data=c.toDataURL("image/jpeg",0.6)}
      Store.fs.collection("fotos").doc(id).set({data,creado:new Date().toISOString(),por:Store.user}).catch(()=>{});
      return {id,fb:true};}
    if(Store.assets){try{const r=await Store.assets.upload(blob);return {id:r.id,url:r.url,nube:true}}catch(e){toast("Sin conexión: la foto queda guardada en esta tablet")}}
    const id=uid("p");await this.idbDo("readwrite",s=>s.put(blob,id));return {id,nube:false};
  },
  async src(f){
    if(f.nube)return f.url||("/_blob/"+f.id);
    if(this.urls[f.id])return this.urls[f.id];
    if(f.fb){try{const b=await this.idbDo("readonly",s=>s.get(f.id));if(b)return this.urls[f.id]=URL.createObjectURL(b)}catch(e){}
      try{const d=await Store.fs.collection("fotos").doc(f.id).get();const x=d.exists&&d.data().data;return x?(this.urls[f.id]=x):""}catch(e){return ""}}
    try{const b=await this.idbDo("readonly",s=>s.get(f.id));if(!b)return "";return this.urls[f.id]=URL.createObjectURL(b)}catch(e){return ""}
  },
  async remove(f){if(f.fb){try{await this.idbDo("readwrite",s=>s.delete(f.id))}catch(e){}if(Store.fs)Store.fs.collection("fotos").doc(f.id).delete().catch(()=>{});return}try{if(f.nube&&Store.assets)await Store.assets.delete(f.id);else if(!f.nube)await this.idbDo("readwrite",s=>s.delete(f.id))}catch(e){}},
  async toDataURL(id){const b=await this.idbDo("readonly",s=>s.get(id));if(!b)return null;return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})},
  async fromDataURL(id,d){const [h,b64]=d.split(",");const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const b=new Blob([u],{type:(h.match(/:(.*?);/)||[])[1]||"image/jpeg"});await this.idbDo("readwrite",s=>s.put(b,id))}
};

}

/* ===== Firebase (app instalable con datos compartidos) ===== */
const FBV="10.12.2";
function cargarScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initFirebase(){
  try{if(!window.firebase||!firebase.firestore)for(const m of ["app","auth","firestore"])await cargarScript((window.FIREBASE_SDK||`https://www.gstatic.com/firebasejs/${FBV}/`)+`firebase-${m}-compat.js`)}
  catch(e){$("#synctxt").textContent="Sin conexión";$("#main").innerHTML=`<div class="empty"><strong>No se pudo abrir la app</strong><span class="muted">La primera vez hace falta internet. Conectate y volvé a abrirla.</span></div>`;return null}
  if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
  const fs=firebase.firestore(),auth=firebase.auth();
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  if(window.FIREBASE_EMU){fs.useEmulator("localhost",8080);auth.useEmulator("http://localhost:9099")}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  const user=await new Promise(res=>{const un=auth.onAuthStateChanged(u=>{un();res(u)})});
  if(!user){mostrarLogin(auth);return null}
  Store.user=user.email||"";Store.fs=fs;
  return fs;
}

/* ===== Modelo ===== */
function nextNumero(){const ns=Store.list("fichas").map(f=>parseInt(f.numero,10)||0);return String((ns.length?Math.max(...ns):0)+1).padStart(5,"0")}
function newFicha(c){
  const items={};ITEMS.forEach((_,i)=>{items[i+1]={estado:"",obs:""}});
  const extras=plantilla().map(x=>({id:x.id,nombre:x.nombre})),oc=ocultos().slice();extras.forEach(x=>{items[x.id]={estado:"",obs:""}});
  return {id:uid("f"),numero:nextNumero(),camionId:c.id,estado:"abierta",creada:new Date().toISOString(),creadoPor:Store.user||"",
    fechaEntrada:today(),fechaSalida:"",
    vehiculo:{umc:c.umc,patente:c.patente,marca:c.marca,modelo:c.modelo,anio:c.anio,tipo:c.tipo,chasis:c.chasis,propietario:c.propietario,aseguradora:c.aseguradora,combustible:c.combustible},
    km:"",horometro:"",conductor:"",cedula:"",telefono:"",nivel:"",motivo:"",
    items,extras,ocultos:oc,fotos:[],otros:"",trabajos:[],obsMecanico:"",obsConductor:"",
    proximo:{fecha:"",km:"",tipo:"",pendientes:""},
    firmas:{jefe:{},mecanico:{},supervisor:{},conductor:{}}};
}
function resumen(f){
  const ks=keysOf(f);let B=0,R=0,M=0,NA=0,done=0;
  ks.forEach(k=>{const v=(f.items||{})[k]||{};if(v.estado){done++;if(v.estado==="B")B++;else if(v.estado==="R")R++;else if(v.estado==="M")M++;else NA++}});
  return {B,R,M,NA,done,total:ks.length};
}
function keysOf(f){const oc=(f&&f.ocultos)||[];return [...ITEMS.slice(0,39).map((_,i)=>String(i+1)).filter(k=>!oc.includes(k)),...((f&&f.extras)||[]).map(x=>x.id),"40"]
}
function fichasDe(cid){return Store.list("fichas").filter(f=>f.camionId===cid).sort((a,b)=>(b.fechaEntrada||"").localeCompare(a.fechaEntrada||"")||(b.numero||"").localeCompare(a.numero||""))}
function statusPill(f){
  if(!f)return `<span class="pill na">Sin fichas</span>`;
  if(f.estado==="abierta")return `<span class="pill info">Ficha abierta</span>`;
  const r=resumen(f);
  if(r.M)return `<span class="pill bad">${r.M} ítem(s) malo(s)</span>`;
  if(r.R)return `<span class="pill warn">${r.R} regular(es)</span>`;
  return `<span class="pill ok">En condiciones</span>`;
}

const state={view:"flota",fichaId:null,q:"",filtroCamion:"",filtroEstado:""};
let BORRADOR=null;
function nuevaBorrador(c){const f=newFicha(c);f.numero="";f.borrador=true;BORRADOR=f;go("editor",{fichaId:f.id})}
function descartarBorrador(){if(BORRADOR)(BORRADOR.fotos||[]).forEach(x=>{try{Fotos.remove(x)}catch(e){}});BORRADOR=null;if(F&&F.borrador){F=null;dirty=false;clearTimeout(saveT)}}
function guardarBorrador(){if(!F||!F.borrador)return;clearTimeout(saveT);delete F.borrador;F.numero=nextNumero();F.creada=new Date().toISOString();
  Store.save("fichas",JSON.parse(JSON.stringify(F)));BORRADOR=null;dirty=false;const n=F.numero;render();toast(`Ficha N° ${n} guardada`)}
function go(view,opts={}){
  if(F&&F.borrador&&state.view==="editor"&&(view!=="editor"||opts.fichaId!==F.id)){const v=view,o=opts;
    confirmar("Esta ficha nueva todavía no se guardó. Si salís, se descarta y no se genera ningún número.","Descartar",()=>{descartarBorrador();go(v,o)});return}
  Object.assign(state,{view},opts);if(view!=="editor"){try{history.replaceState(null,"","#"+view)}catch(e){}}render();window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.view==="historial")state.filtroCamion="";go(b.dataset.view)}));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h==="flota"||h==="historial"||h==="alertas")go(h)});

function render(fromSync){
  if(fromSync&&state.view==="editor")return; // no pisar lo que se está escribiendo
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",String(b.dataset.view===state.view||(state.view==="editor"&&b.dataset.view==="historial")||(state.view==="camion"&&b.dataset.view==="flota"))));
  $("#bar").innerHTML="";
  const ph=pendientesHoy(),bd=$("#badge");if(bd){bd.hidden=!ph.total;bd.textContent=ph.total}
  if(state.view==="flota")renderFlota();
  else if(state.view==="historial")renderHistorial();
  else if(state.view==="alertas")renderAlertas();
  else if(state.view==="camion")renderCamion();
  else renderEditor();
}

const byUmc=(a,b)=>String(a.umc||a.patente||"").localeCompare(String(b.umc||b.patente||""),"es",{numeric:true});
function renderFlota(){
  const q=state.q.toLowerCase();
  const todos=Store.list("camiones");const tiposPres=[...new Set(todos.map(c=>c.tipo).filter(Boolean))].sort((a,b)=>TIPOS.indexOf(a)-TIPOS.indexOf(b));
  const cams=todos.filter(c=>(!state.tipo||c.tipo===state.tipo||(state.tipo==="__taller"&&c.fuera))&&(!q||[c.umc,c.patente,c.marca,c.modelo,c.tipo].join(" ").toLowerCase().includes(q))).sort(byUmc);
  const loading=Store.mode==="nube"&&!Store.loaded.camiones&&!cams.length;
  const total=Store.list("camiones").length, abiertas=Store.list("fichas").filter(f=>f.estado==="abierta").length, enTaller=Store.list("camiones").filter(c=>c.fuera).length;
  $("#main").innerHTML=`
    <div class="row"><h2 style="font-size:30px;margin-right:auto">Flota <span class="muted mono" style="font-size:20px">${total} unidades · ${total-enTaller} operativas · <span style="color:${enTaller?"var(--bad)":"inherit"}">${enTaller} en taller</span>${abiertas?` · ${abiertas} ficha${abiertas>1?"s":""} abierta${abiertas>1?"s":""}`:""}</span></h2>
    <button class="btn adm" id="cfgItems2">Ítems del checklist</button><button class="btn" id="xlsFl">Exportar informe Excel</button><button class="btn adm" id="impSheet">Importar planilla de flota</button><button class="btn primary adm" id="addCam">+ Agregar camión</button></div>
    ${(()=>{const ph=pendientesHoy();return ph.total?`<button class="banner" id="goAl"><b>${ph.al?`${ph.al} alerta${ph.al>1?"s":""} para revisar hoy`:""}${ph.al&&ph.ct?" · ":""}${ph.ct?`${ph.ct} control${ph.ct>1?"es":""} vencido${ph.ct>1?"s":""} o por vencer`:""}</b><span>Ver alertas →</span></button>`:""})()}
    <div class="row"><input class="search" id="q" type="search" placeholder="Buscar por UMC, patente, marca, modelo o tipo" value="${esc(state.q)}"></div>
    ${tiposPres.length>1||enTaller?`<div class="tfil"><button data-tipo="" aria-pressed="${!state.tipo}">Todos <b class="mono">${todos.length}</b></button>${enTaller?`<button data-tipo="__taller" style="--tc:var(--bad)" aria-pressed="${state.tipo==="__taller"}"><i></i>En taller <b class="mono">${enTaller}</b></button>`:""}${tiposPres.map(t=>`<button data-tipo="${esc(t)}" style="${tc(t)}" aria-pressed="${state.tipo===t}"><i></i>${esc(t)} <b class="mono">${todos.filter(c=>c.tipo===t).length}</b></button>`).join("")}</div>`:""}
    ${loading?`<div class="empty"><strong>Cargando la flota…</strong></div>`:
      cams.length?`<div class="grid-cards">${cams.map(cardCamion).join("")}</div>`:
      `<div class="empty"><h3 style="font-size:22px">Todavía no hay camiones cargados</h3><p class="muted" style="margin:0">Subí la planilla de la flota (Excel o CSV) con una fila por UMC, o agregá cada unidad a mano.</p><p class="soloTaller" style="margin:0"><b>El administrador tiene que cargar la flota.</b></p><div class="row" style="justify-content:center">${window.SEED_URL?`<button class="btn primary adm" id="seedBtn">Cargar la flota SJC</button>`:""}<button class="btn adm ${window.SEED_URL?"":"primary"}" id="impSheet2">Importar planilla de flota</button><button class="btn adm" id="addCam2">+ Agregar a mano</button></div></div>`}

    <p class="muted noprint" style="font-size:12px;margin:8px 0 0">Versión ${APP_VERSION}</p>`;
  $("#addCam").onclick=()=>camionModal();const ga=$("#goAl");if(ga)ga.onclick=()=>go("alertas");
  const a2=$("#addCam2");if(a2)a2.onclick=()=>camionModal();
  $("#impSheet").onclick=pickSheet;$("#xlsFl").onclick=informeModal;$("#cfgItems2").onclick=itemsModal;const sb=$("#seedBtn");if(sb)sb.onclick=async()=>{sb.disabled=true;try{const d=await (await fetch(window.SEED_URL)).json();d.camiones.forEach(c=>Store.save("camiones",c));render();toast(`${d.camiones.length} móviles cargados`)}catch(e){sb.disabled=false;toast("No se pudo cargar la flota")}};const i2=$("#impSheet2");if(i2)i2.onclick=pickSheet;

  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const c=Store.get("camiones",b.dataset.id);if(!c)return;

function cargarFotosCamion(){document.querySelectorAll("[data-cfoto]").forEach(im=>{const c=Store.get("camiones",im.dataset.cfoto);if(c&&c.foto)Fotos.src(c.foto).then(u=>{if(u)im.src=u})})}

/* ===== Importar flota desde planilla (Excel / CSV) ===== */
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const ALIAS={umc:["umc","movil","nmovil","nromovil","numerodemovil","interno","ninterno","unidad","nombre","nombremovil"],
  patente:["patente","placa","dominio","patenteplaca","matricula"],marca:["marca"],modelo:["modelo"],anio:["ano","anio","year","anofabricacion","modeloano"],
  chasis:["chasis","nchasis","nrochasis","numerodechasis","numerochasis","vin"],
  tipo:["tipo","tipodeunidad","tipounidad","categoria","clase"],combustible:["combustible","tipocombustible"],
  propietario:["propietario","dueno","titular"],aseguradora:["aseguradora","seguro","compania","companiaseguro"]};
const IGNORAR=["color","motor","nmotor","nromotor","numerodemotor","numeromotor"];
const ALIAS_IDX={};Object.entries(ALIAS).forEach(([k,a])=>a.forEach(x=>ALIAS_IDX[x]=k));
function pickSheet(){const i=$("#sheetIn");i.value="";i.onchange=()=>{const f=i.files[0];if(f)leerPlanilla(f)};i.click()}
function parseCSV(t){const sep=(t.split("\n")[0].match(/;/g)||[]).length>(t.split("\n")[0].match(/,/g)||[]).length?";":",";const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'&&t[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=""}else if(ch==="\n"){row.push(cur.replace(/\r$/,""));rows.push(row);row=[];cur=""}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows}
async function leerPlanilla(file){if(soloAdmin())return;
  let rows;
  try{
    if(/\.csv$/i.test(file.name)||file.type==="text/csv")rows=parseCSV(await file.text());
    else{if(!window.XLSX){toast("Para leer Excel hace falta internet. Sin conexión, guardá la planilla como CSV.");return}
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""})}
  }catch(e){toast("No se pudo leer el archivo");return}
  rows=rows.filter(r=>r.some(v=>String(v).trim()!==""));
  // buscar la fila de encabezados (la primera que tenga UMC o patente)
  let hi=rows.findIndex(r=>r.some(v=>["umc","patente","placa","dominio","movil","interno"].includes(norm(v))));if(hi<0)hi=0;
  const head=rows[hi]||[],body=rows.slice(hi+1);
  const map=head.map(h=>ALIAS_IDX[norm(h)]||null);
  if(!map.includes("umc")){toast("La planilla necesita una columna UMC");return}
  const desconocidas=head.filter((h,i)=>!map[i]&&String(h).trim()&&!IGNORAR.includes(norm(h)));
  const existentes={};Store.list("camiones").forEach(c=>{if(c.umc)existentes[String(c.umc).trim().toLowerCase()]=c});
  const nuevos=[],act=[],omit=[];const vistos=new Set();
  body.forEach((r,ri)=>{
    const o={otros:{}};head.forEach((h,i)=>{const v=String(r[i]??"").trim();if(map[i])o[map[i]]=v;else if(String(h).trim()&&v&&!IGNORAR.includes(norm(h)))o.otros[String(h).trim()]=v});
    if(!o.umc){omit.push(ri+hi+2);return}
    const key=o.umc.toLowerCase();if(vistos.has(key)){omit.push(ri+hi+2);return}vistos.add(key);
    if(o.patente)o.patente=o.patente.toUpperCase();
    if(o.tipo){const t=TIPO_ALIAS[norm(o.tipo)]||TIPOS.find(x=>norm(x)===norm(o.tipo));if(t)o.tipo=t}
    if(o.combustible){const t=COMBUSTIBLES.find(x=>norm(x)===norm(o.combustible));if(t)o.combustible=t}
    const ex=existentes[key];
    if(ex)act.push({...ex,...Object.fromEntries(Object.entries(o).filter(([k,v])=>k!=="otros"&&v!=="")),otros:{...(ex.otros||{}),...o.otros}});
    else nuevos.push({id:uid("c"),umc:"",patente:"",marca:"",modelo:"",anio:"",tipo:"",chasis:"",combustible:"",propietario:"",aseguradora:"",...o});
  });
  const cols=[...new Set(map.filter(Boolean))];
  const prev=[...nuevos,...act].slice(0,10);
  $("#layer").innerHTML=`<div class="overlay"><div class="modal" style="max-width:980px"><h2>Importar flota</h2>
    <p style="margin:0"><b>${esc(file.name)}</b>: <b>${nuevos.length}</b> UMC nuevos, <b>${act.length}</b> se actualizan${omit.length?`, <b>${omit.length}</b> filas omitidas (sin UMC o repetidas: fila ${omit.slice(0,8).join(", ")}${omit.length>8?"…":""})`:""}.</p>
    <p class="muted" style="margin:0">Columnas reconocidas: ${cols.map(k=>(CAMPOS.find(c=>c[0]===k)||[0,k])[1]).join(", ")}.${desconocidas.length?` Columnas extra que se guardan como "otros datos": ${desconocidas.map(esc).join(", ")}.`:""}</p>
    <div class="tablebox prev"><table><thead><tr>${cols.map(k=>`<th>${esc((CAMPOS.find(c=>c[0]===k)||[0,k])[1])}</th>`).join("")}<th>Estado</th></tr></thead><tbody>${prev.map(c=>`<tr>${cols.map(k=>`<td>${esc(c[k])}</td>`).join("")}<td>${nuevos.includes(c)?`<span class="pill ok">Nuevo</span>`:`<span class="pill info">Actualiza</span>`}</td></tr>`).join("")}</tbody></table></div>
    ${nuevos.length+act.length>10?`<span class="muted">Se muestran 10 de ${nuevos.length+act.length}.</span>`:""}
    <div class="row" style="justify-content:flex-end"><button class="btn" id="icancel">Cancelar</button><button class="btn primary" id="iok" ${nuevos.length+act.length?"":"disabled"}>Importar ${nuevos.length+act.length} camiones</button></div></div></div>`;
  $("#icancel").onclick=()=>$("#layer").innerHTML="";
  $("#iok").onclick=()=>{[...nuevos,...act].forEach(c=>{delete c.ejemplo;Store.save("camiones",c)});$("#layer").innerHTML="";render();toast(`Flota importada: ${nuevos.length} nuevos, ${act.length} actualizados`)};
}
async function plantillaModelo(){
  const head=["UMC","Patente","Tipo","Marca","Modelo","Año","N° Chasis","Combustible","Propietario","Aseguradora"];
  const ej=["MIX 01","AB 123 CD","Mixer","Scania","P380","2019","","Diésel","SJC",""];
  const csv="﻿"+[head,ej].map(r=>r.map(v=>/[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v).join(";")).join("\r\n");
  await guardarArchivo("planilla-flota-modelo.csv",csv,"text/csv");

async function guardarArchivo(filename,data,type){

/* ===== Alertas y control periódico ===== */
const AJ_DEF={diasM:3,diasR:7,frecuencia:30,avisoAntes:3};
function ajustes(){return {...AJ_DEF,...(Store.get("config","ajustes")||{})}}
const addDays=(s,n)=>{const d=new Date((s||today())+"T12:00:00");d.setDate(d.getDate()+Number(n||0));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const diffDays=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const haceTxt=n=>n<=0?"hoy":n===1?"hace 1 día":`hace ${n} días`;
function alertasAbiertas(cid){return Store.list("alertas").filter(a=>a.estado==="abierta"&&(!cid||a.camionId===cid))}
const alertaVencida=a=>a.estado==="abierta"&&(a.proximoAviso||"")<=today();
function avisoN(a){return 1+Math.floor(Math.max(0,diffDays(a.detectada,today()))/Math.max(1,a.cadaDias||1))}
function ultimoControl(cid){return fichasDe(cid).find(f=>f.estado==="cerrada")}
function controlInfo(c){
  const aj=ajustes(),freq=Number(c.frecuencia)||aj.frecuencia,u=ultimoControl(c.id);
  if(!u)return {estado:"sin",txt:"Sin controles",prox:null,freq};
  const prox=addDays(u.fechaEntrada,freq),d=diffDays(today(),prox);
  if(d<0)return {estado:"vencido",txt:`Control vencido ${haceTxt(-d)}`,prox,freq,d};
  if(d<=aj.avisoAntes)return {estado:"pronto",txt:d===0?"Control vence hoy":`Control vence en ${d} día${d>1?"s":""}`,prox,freq,d};
  return {estado:"ok",txt:`Próximo control ${fdate(prox)}`,prox,freq,d};
}
function controlPill(ci){return `<span class="pill ${ci.estado==="vencido"?"bad":ci.estado==="pronto"?"warn":ci.estado==="sin"?"na":"ok"}">${esc(ci.txt)}</span>`}
function pendientesHoy(){
  const al=Store.list("alertas").filter(alertaVencida).length;
  const ct=Store.list("camiones").filter(c=>{const s=controlInfo(c).estado;return s==="vencido"||s==="pronto"}).length;
  return {al,ct,total:al+ct};
}
/* Al cerrar una ficha: crea, repite o resuelve alertas según el estado de cada ítem */
function generarAlertas(f){
  const aj=ajustes(),hoy=today(),base=f.fechaEntrada||today();let nuevas=0,resueltas=0,repetidas=0;
  const abiertas=alertasAbiertas(f.camionId);
  keysOf(f).forEach(k=>{
    const it=f.items[k]||{},est=it.estado,ab=abiertas.find(a=>a.item===k);
    const nombre=itemNombreDe(f,k).replace(/^\d+\.\s*/,"");
    if(est==="R"||est==="M"){
      const dias=est==="M"?aj.diasM:aj.diasR;
      if(ab){const a=JSON.parse(JSON.stringify(ab));a.nivel=est==="M"||a.nivel==="M"?"M":"R";a.obs=it.obs||a.obs;
        a.seguimiento.push({fecha:base,tipo:"repetida",texto:`Sigue ${EST_LABEL[est]} en ficha N° ${f.numero}${it.obs?": "+it.obs:""}`});
        if(!a.proximoAviso||a.proximoAviso>addDays(base,dias))a.proximoAviso=addDays(base,dias);Store.save("alertas",a);repetidas++}
      else{Store.save("alertas",{id:uid("a"),camionId:f.camionId,umc:f.vehiculo.umc||"",patente:f.vehiculo.patente||"",item:k,nombre,nivel:est,obs:it.obs||"",
        fichaId:f.id,fichaNumero:f.numero,detectada:f.fechaEntrada||hoy,cadaDias:dias,proximoAviso:addDays(base,dias),estado:"abierta",
        seguimiento:[{fecha:f.fechaEntrada||hoy,tipo:"detectada",texto:`Detectado ${EST_LABEL[est]} en ficha N° ${f.numero}${it.obs?": "+it.obs:""}`}]});nuevas++}
    }else if(est==="B"&&ab){const a=JSON.parse(JSON.stringify(ab));a.estado="resuelta";a.resuelta={fecha:base,texto:`Marcado Bueno en ficha N° ${f.numero}`};
      a.seguimiento.push({fecha:base,tipo:"resuelta",texto:a.resuelta.texto});Store.save("alertas",a);resueltas++}
  });
  return {nuevas,resueltas,repetidas};
}

    this.xfs.push(`<xf numFmtId="${nf}" fontId="${fid}" fillId="${flid}" borderId="${bid}" xfId="0" applyFont="1"${flid?' applyFill="1"':""}${bid?' applyBorder="1"':""}${nf?' applyNumberFormat="1"':""}${al?' applyAlignment="1">'+al+"</xf>":"/>"}`);

  Styles.prototype.xml=function(){return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${this.fmts.length?`<numFmts count="${this.fmts.length}">${this.fmts.map((f,i)=>`<numFmt numFmtId="${164+i}" formatCode="${X(f)}"/>`).join("")}</numFmts>`:""}<fonts count="${this.fonts.length}">${this.fonts.join("")}</fonts><fills count="${this.fills.length}">${this.fills.join("")}</fills><borders count="${this.borders.length}">${this.borders.join("")}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${this.xfs.length}">${this.xfs.join("")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`};

function hojaAlertasHTML(soloHoy,camionId,saltos){
  const al=Store.list("alertas").filter(a=>a.estado==="abierta"&&(!soloHoy||alertaVencida(a))&&(!camionId||a.camionId===camionId));
  const grupos={};al.forEach(a=>{(grupos[a.camionId]=grupos[a.camionId]||[]).push(a)});
  const ids=Object.keys(grupos).sort((x,y)=>byUmc(Store.get("camiones",x)||grupos[x][0],Store.get("camiones",y)||grupos[y][0]));
  const fecha=new Date().toLocaleDateString("es-AR");
  const head=`<div class="pa-head"><div><b>SAN JOSÉ CONCRETOS</b><span>Alertas abiertas a revisar${soloHoy?" · para hoy":""}</span></div><div class="pa-meta">Fecha: ${fecha}<br>Móviles: ${ids.length} · Alertas: ${al.length}</div></div>`;
  if(!ids.length)return head+`<p>No hay alertas abiertas${soloHoy?" para revisar hoy":""}.</p>`;
  return head+ids.map((id,i)=>{const c=Store.get("camiones",id)||{},g=grupos[id].sort((a,b)=>(a.nivel===b.nivel?0:a.nivel==="M"?-1:1)||(a.detectada||"").localeCompare(b.detectada||""));
    return `<section class="pa-umc${saltos&&i?" pa-break":""}">${saltos&&i?head:""}<div class="pa-ttl"><span class="pa-u">UMC ${esc(c.umc||g[0].umc)}</span><span>${esc(c.patente||g[0].patente||"")}</span><span>${esc([c.tipo,c.marca,c.modelo].filter(Boolean).join(" · "))}</span>${c.fuera?`<span class="pa-t">EN TALLER desde ${fdate(c.fuera.desde)}</span>`:""}<span style="margin-left:auto">${g.length} alerta${g.length>1?"s":""}</span></div>
      <table class="pa-tb"><thead><tr><th style="width:4%">#</th><th style="width:26%">Ítem</th><th style="width:8%">Nivel</th><th style="width:22%">Observación</th><th style="width:10%">Detectada</th><th style="width:7%">Días</th><th style="width:7%">Aviso</th><th style="width:16%">Revisado / Comentario</th></tr></thead>
      <tbody>${g.map((a,j)=>`<tr><td>${j+1}</td><td><b>${esc(a.nombre)}</b>${alertaVencida(a)?` <span class="pa-hoy">HOY</span>`:""}</td><td class="${a.nivel==="M"?"pa-m":"pa-r"}">${EST_LABEL[a.nivel]}</td><td>${esc(a.obs||"")}</td><td>${fdate(a.detectada)}<br><small>Ficha ${esc(a.fichaNumero)}</small></td><td>${Math.max(0,diffDays(a.detectada,today()))}</td><td>N° ${avisoN(a)}</td><td><span class="pa-box"></span></td></tr>`).join("")}</tbody></table>
      <div class="pa-firm"><span>Operador: ______________________</span><span>Jefe de control: ______________________</span><span>Fecha revisión: ____/____/______</span></div></section>`}).join("");
}

function itemNombreDe(f,k){const ex=(f&&f.extras)||[];const pos=keysOf(f).indexOf(k)+1;if(k==="40")return (pos||40+ex.length)+". "+ITEMS[39];if(/^\d+$/.test(k))return (pos||k)+". "+ITEMS[+k-1];const i=ex.findIndex(x=>x.id===k);return i<0?k:(pos||40+i)+". "+ex[i].nombre}

  });
  if(!ro){
    $("#allB").onclick=()=>{let n=0;keysOf(F).forEach(k=>{if(!F.items[k].estado){setEstado(k,"B");n++}});scheduleSave();toast(n?`${n} ítem(s) marcados como Bueno`:"No quedaban ítems pendientes")};
    $("#xadd").onsubmit=e=>{e.preventDefault();const nm=$("#xaddname").value.trim();if(!nm)return;
      let x={id:uid("x"),nombre:nm};
      {const pl=plantilla();const same=pl.find(p=>norm(p.nombre)===norm(nm));if(same)x={...same};else setPlantilla([...pl,x])}
      if((F.extras||[]).some(e=>e.id===x.id)){toast("Ese ítem ya está en la ficha");return}
      F.extras=[...(F.extras||[]),x];F.items[x.id]={estado:"",obs:""};$("#checks").innerHTML=checkRows();updateCounts();scheduleSave();$("#xaddname").value="";toast("Ítem agregado a todas las fichas")};
    const nm=$("#naMixer");if(nm)nm.onclick=()=>{MIXER_ONLY.forEach(n=>{if(keysOf(F).includes(String(n))&&!F.items[n].estado)setEstado(n,"NA")});scheduleSave()};
    $("#addJob").onclick=()=>{F.trabajos.push({desc:"",cant:"",unidad:"",tiempo:"",costo:"",mecanico:"",estado:"Pendiente"});renderJobs();scheduleSave();const l=document.querySelector(`[data-job="${F.trabajos.length-1}:desc"]`);if(l)l.focus()};
    {const dF=$("#delF");if(dF)dF.onclick=()=>eliminarFicha(F)}
    FIRMAS.forEach(([k])=>initSig(k));
  }
  document.querySelectorAll(".secnav a").forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.getAttribute("href").slice(1));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
  renderBar(ro);
}
function getP(p){return p.split(".").reduce((o,k)=>o==null?"":o[k],F)??""}
function setP(p,v){const ks=p.split(".");let o=F;ks.slice(0,-1).forEach(k=>{o[k]=o[k]||{};o=o[k]});o[ks.at(-1)]=v}
function checkRows(){const ex=F.extras||[];return keysOf(F).map((k,i)=>{const x=ex.find(e=>e.id===k);return x?itemRow(k,i+1,x.nombre,true):itemRow(k,i+1,ITEMS[+k-1],false)}).join("")}
function fotosDeItem(k){return (F.fotos||[]).filter(f=>f.item===k).length}
function itemRow(n,num,name,isX){
  const it=F.items[n]||(F.items[n]={estado:"",obs:""});
  const extra=n==="40"?`<input id="otros" placeholder="Especificar…" value="${esc(F.otros)}">`:"";
  const tag=MIXER_ONLY.includes(+n)&&!isX?` <span class="chip" style="font-size:10px">Mixer</span>`:"";
  const xt=(isX?` <span class="xtra">Adicional</span>`:"")+(n!=="40"&&F.estado!=="cerrada"&&esAdmin()?` <button type="button" class="qx noprint adm" data-quitar="${n}" title="Quitar este ítem de todas las fichas">✕ Quitar</button>`:"");
  const fc=fotosDeItem(n);
  return `<div class="item ${needs(n)?"need":""}" id="it-${n}"><span class="num">${num}.</span><span class="name">${esc(name)}${tag}${xt}${extra}</span>
    <div class="est" data-item="${n}">${["B","R","M","NA"].map(v=>`<button type="button" class="${v==="NA"?"na":""}" data-v="${v}" aria-pressed="${it.estado===v}" aria-label="${EST_LABEL[v]}" title="${EST_LABEL[v]}">${v==="NA"?"N/A":v}</button>`).join("")}<button type="button" class="camb noprint ${fc?"has":""}" data-camitem="${n}" title="Sacar foto de este ítem">${fc?fc+" foto"+(fc>1?"s":""):"+ Foto"}</button></div>
    <div class="obs"${it.estado==="R"||it.estado==="M"||it.obs?"":" hidden"}><input data-obs="${n}" placeholder="Observación${it.estado==="R"||it.estado==="M"?" (obligatoria)":""}" value="${esc(it.obs)}"></div></div>`;
}
function itemNombre(k){return itemNombreDe(F,k)}
function quitarItem(k){if(soloAdmin()||!F||k==="40")return;const nm=itemNombre(k).replace(/^\d+\.\s*/,"");const isX=(F.extras||[]).some(x=>x.id===k);
  confirmar(`¿Quitar "${nm}" del checklist? Deja de aparecer en esta ficha, en las abiertas y en las nuevas. Las fichas cerradas no cambian. Se puede volver a mostrar desde Flota → Ítems del checklist.`,"Quitar",()=>{
    if(isX){setPlantilla(plantilla().filter(x=>x.id!==k));F.extras=F.extras.filter(x=>x.id!==k);delete F.items[k]}
    else{const oc=ocultos();if(!oc.includes(k))setOcultos([...oc,k].sort((a,b)=>a-b));F.ocultos=[...new Set([...(F.ocultos||[]),k])]}
    F.fotos=(F.fotos||[]).map(f=>f.item===k?{...f,item:""}:f);
    const y=window.scrollY;$("#checks").innerHTML=checkRows();updateCounts();renderPhotos();scheduleSave();window.scrollTo(0,y);toast(`"${nm}" quitado`)})}
function renderCover(){
  const box=$("#cimg");if(!box||!F)return;const ro=F.estado==="cerrada";const c=Store.get("camiones",F.camionId)||{};
  const foto=F.portada||c.foto;
  box.innerHTML=(foto?`<img alt="Foto de portada" id="cvimg">`:`<div class="ph0"><b>Sin foto de portada</b><span>Sacale una foto al camión al empezar el control</span></div>`)
    +(ro?"":`<div class="cbtns noprint"><button type="button" class="btn" data-cover="cam">${foto?"Cambiar foto":"Tomar foto"}</button><button type="button" class="btn" data-cover="gal">Galería</button></div>`);
  if(foto)Fotos.src(foto).then(u=>{const i=$("#cvimg");if(i&&u)i.src=u});
  box.querySelectorAll("[data-cover]").forEach(b=>b.onclick=async()=>{const fid=F.id;const r=await elegirFoto(b.dataset.cover==="cam");if(!r||!F||F.id!==fid)return;F.portada=r;scheduleSave();setFotoCamion(F.camionId,r);renderCover();toast("Foto de portada guardada")});
}
function renderPhotos(){
  const box=$("#photos");if(!box)return;const ro=F.estado==="cerrada";const fs=F.fotos||[];
  $("#fcnt").textContent=fs.length?`(${fs.length})`:"";
  box.innerHTML=fs.map((f,i)=>`<div class="ph"><button type="button" class="thumb" data-viewph="${i}" aria-label="Ver foto ${i+1}"><img alt="" data-phsrc="${i}">${f.item?`<span class="tagi">Ítem ${esc(itemNombre(f.item).split(".")[0])}</span>`:""}${f.nube||Store.mode==="local"?"":`<span class="tagl" title="Guardada solo en esta tablet">Tablet</span>`}</button><input data-phcap="${i}" placeholder="Descripción" value="${esc(f.desc)}"></div>`).join("")
    +(ro?"":`<button type="button" class="addph noprint" data-addph="cam"><span>+</span>Tomar foto</button><button type="button" class="addph noprint" data-addph="gal"><span>+</span>Elegir de la galería</button>`);
  if(ro&&!fs.length)box.innerHTML=`<span class="muted">Sin fotos.</span>`;
  fs.forEach((f,i)=>Fotos.src(f).then(u=>{const im=box.querySelector(`[data-phsrc="${i}"]`);if(im&&u)im.src=u}));
}
function tomarFoto(item,camara){
  const inp=$("#photoIn");inp.value="";if(camara)inp.setAttribute("capture","environment");else inp.removeAttribute("capture");
  inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;const fid=F.id;toast("Guardando foto…");
    for(const file of files){try{const r=await Fotos.add(file);if(!F||F.id!==fid)return;F.fotos=F.fotos||[];F.fotos.push({...r,item:item||"",desc:"",fecha:new Date().toISOString()})}catch(e){toast("No se pudo guardar la foto")}}
    scheduleSave();renderPhotos();if(item){const row=document.getElementById("it-"+item);if(row){const c=row.querySelector(".camb");const n=fotosDeItem(item);c.classList.add("has");c.textContent=n+" foto"+(n>1?"s":"")}}toast("Foto agregada")};
  inp.click();
}
function verFoto(i){
  const f=F.fotos[i];const ro=F.estado==="cerrada";
  const box=document.createElement("div");box.className="overlay";box.innerHTML=`<div class="modal" style="max-width:980px"><img class="big" alt="Foto ${i+1}" id="bigimg"><div class="muted">${f.item?esc(itemNombre(f.item))+" · ":""}${esc(new Date(f.fecha||Date.now()).toLocaleString("es-AR"))}${f.desc?" · "+esc(f.desc):""}</div><div class="row">${ro?"":`<button class="btn danger" data-del>Eliminar foto</button>`}<span style="flex:1"></span><button class="btn" data-x>Cerrar</button></div></div>`;
  document.body.appendChild(box);Fotos.src(f).then(u=>{if(u)box.querySelector("#bigimg").src=u});
  box.querySelector("[data-x]").onclick=()=>box.remove();
  const d=box.querySelector("[data-del]");if(d)d.onclick=()=>{box.remove();confirmar("¿Eliminar esta foto?","Eliminar",()=>{const [x]=F.fotos.splice(i,1);Fotos.remove(x);scheduleSave();renderPhotos();if(x.item){const row=document.getElementById("it-"+x.item);if(row){const c=row.querySelector(".camb");const n=fotosDeItem(x.item);c.classList.toggle("has",!!n);c.textContent=n?n+" foto"+(n>1?"s":""):"+ Foto"}}})};
}
function needs(n){const it=F.items[n];return it&&(it.estado==="R"||it.estado==="M")&&!String(it.obs||"").trim()}
function markNeed(n){const r=document.getElementById("it-"+n);if(r)r.classList.toggle("need",needs(n))}
function setEstado(n,val){
  F.items[n].estado=val;const row=document.getElementById("it-"+n);if(!row)return;
  row.querySelectorAll(".est button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===val)));
  const ob=row.querySelector(".obs");const show=val==="R"||val==="M"||F.items[n].obs;ob.hidden=!show;
  ob.querySelector("input").placeholder="Observación"+(val==="R"||val==="M"?" (obligatoria)":"");
  markNeed(n);updateCounts();
}
function updateCounts(){const r=resumen(F);const c=$("#cnt");if(c)c.textContent=`${r.done}/${r.total} · ${r.B} B · ${r.R} R · ${r.M} M · ${r.NA} N/A`;const p=$("#prog");if(p)p.style.width=(r.done/r.total*100)+"%";updateBar()}
function renderJobs(){
  const tb=$("#jobs");if(!tb)return;
  tb.innerHTML=F.trabajos.length?F.trabajos.map((j,i)=>`<tr><td class="mono">${i+1}</td>
    <td><input data-job="${i}:desc" value="${esc(j.desc)}" placeholder="Ej.: cambio de filtro de aire"></td>
    <td><input data-job="${i}:cant" value="${esc(j.cant)}" inputmode="decimal"></td>
    <td><input data-job="${i}:unidad" value="${esc(j.unidad)}" placeholder="u, l, juego"></td>
    <td><input data-job="${i}:tiempo" value="${esc(j.tiempo)}" inputmode="decimal"></td>
    <td><input data-job="${i}:costo" value="${esc(j.costo)}" inputmode="decimal"></td>
    <td><input data-job="${i}:mecanico" value="${esc(j.mecanico)}"></td>
    <td><select data-job="${i}:estado">${ESTADOS_TRABAJO.map(s=>`<option ${j.estado===s?"selected":""}>${s}</option>`).join("")}</select></td>
    <td><button type="button" class="btn ghost noprint" data-deljob="${i}" aria-label="Quitar fila">✕</button></td></tr>`).join("")
    :`<tr><td colspan="9" class="muted" style="padding:14px">Sin trabajos cargados.</td></tr>`;
  totals();
}
function totals(){const t=F.trabajos.reduce((s,j)=>s+num(j.tiempo),0),c=F.trabajos.reduce((s,j)=>s+num(j.costo)*(j.cant===""?1:num(j.cant)||1),0);const a=$("#tt"),b=$("#tc");if(a)a.textContent=t?t.toLocaleString("es-AR")+" h":"—";if(b)b.textContent=c?"$ "+money(c):"—"}
function sigBox(k,l,ro){const s=F.firmas[k]||{};
  return `<div class="sig"><span class="lbl">${l}</span><input data-firma="${k}" data-k="nombre" placeholder="Nombre y apellido" value="${esc(s.nombre)}">
  ${ro||s.img?(s.img?`<img alt="Firma de ${esc(l)}" src="${s.img}">`:`<div class="muted" style="height:120px;display:grid;place-items:center">Sin firma</div>`):`<canvas id="cv-${k}" aria-label="Firmar aquí"></canvas>`}
  <div class="row"><input data-firma="${k}" data-k="fecha" type="date" value="${esc(s.fecha)}" style="flex:1;min-width:140px">${ro?"":`<button type="button" class="btn ghost" data-clr="${k}">Borrar firma</button>`}</div></div>`}
function initSig(k){
  const clr=document.querySelector(`[data-clr="${k}"]`);
  if(clr)clr.onclick=()=>{F.firmas[k].img="";scheduleSave();const box=clr.closest(".sig");const im=box.querySelector("img");if(im){const cv=document.createElement("canvas");cv.id="cv-"+k;im.replaceWith(cv)}setupCanvas(k)};
  setupCanvas(k);
}
function setupCanvas(k){
  const cv=document.getElementById("cv-"+k);if(!cv)return;
  const r=cv.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*dpr);cv.height=120*dpr;
  const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.lineWidth=2.2*dpr;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#10202b";
  let drawing=false,drew=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)*dpr,(e.clientY-b.top)*dpr]};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y)};
  cv.onpointermove=e=>{if(!drawing)return;const [x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke();drew=true};
  cv.onpointerup=cv.onpointercancel=()=>{if(!drawing)return;drawing=false;if(drew){
    const s=document.createElement("canvas");s.width=360;s.height=120;s.getContext("2d").drawImage(cv,0,0,360,120);
    F.firmas[k].img=s.toDataURL("image/jpeg",0.7);if(!F.firmas[k].fecha){F.firmas[k].fecha=today();const d=document.querySelector(`[data-firma="${k}"][data-k="fecha"]`);if(d)d.value=today()}scheduleSave()}};
}
function renderBar(ro){
  $("#bar").innerHTML=`<div class="bar noprint"><div class="wrap"><span class="stat" id="bstat"></span>
    ${window.top===window?`<button class="btn" id="print" type="button">Imprimir</button>`:""}
    ${ro?"":F&&F.borrador?`<button class="btn" id="discard" type="button">Descartar</button><button class="btn primary" id="saveNew" type="button">Guardar ficha</button>`:`<button class="btn primary" id="close" type="button">Cerrar ficha</button>`}</div></div>`;
  const p=$("#print");if(p)p.onclick=()=>{saveNow();window.print()};
  const c=$("#close");if(c)c.onclick=cerrarFicha;
  const sn=$("#saveNew");if(sn)sn.onclick=guardarBorrador;
  const dc=$("#discard");if(dc)dc.onclick=()=>confirmar("¿Descartar esta ficha nueva? No se guarda nada y no se genera número.","Descartar",()=>{descartarBorrador();go("flota")});
  updateBar();
}
function updateBar(){const b=$("#bstat");if(!b||!F)return;const r=resumen(F);b.innerHTML=`<b class="mono">${r.done}/${r.total}</b> ítems revisados · ${F.borrador?"<b>Sin guardar</b>: tocá Guardar ficha":dirty?"Guardando…":"Guardado"}`}
function cerrarFicha(){
  const faltan=keysOf(F).filter(n=>!F.items[n].estado);
  const sinObs=keysOf(F).filter(needs);
  if(faltan.length||sinObs.length){
    const n=faltan[0]||sinObs[0];
    toast(faltan.length?`Faltan ${faltan.length} ítem(s) sin estado (ej.: ${itemNombre(faltan[0])})`:`${itemNombre(sinObs[0])}: R o M necesita observación`);
    const el=document.getElementById("it-"+n);if(el){el.scrollIntoView({behavior:"smooth",block:"center"})}return;
  }
  confirmar("¿Cerrar la ficha? Quedará en modo lectura (se puede reabrir).","Cerrar ficha",()=>{
    F.estado="cerrada";if(!F.fechaSalida)F.fechaSalida=today();dirty=true;saveNow();
    const g=generarAlertas(F);render();
    toast("Ficha cerrada"+(g.nuevas?` · ${g.nuevas} alerta(s) nueva(s)`:"")+(g.repetidas?` · ${g.repetidas} siguen pendientes`:"")+(g.resueltas?` · ${g.resueltas} resuelta(s)`:""));window.scrollTo(0,0)});
}

/* ===== Respaldo ===== */
async function exportar(){if(soloAdmin())return;
  const fichas=Store.list("fichas");const fotosData={};
  for(const f of fichas)for(const ph of (f.fotos||[]))if(!ph.nube){try{const d=await Fotos.toDataURL(ph.id);if(d)fotosData[ph.id]=d}catch(e){}}
  const json=JSON.stringify({app:"ficha-taller",version:2,exportado:new Date().toISOString(),camiones:Store.list("camiones"),fichas,config:Store.list("config"),alertas:Store.list("alertas"),fotosData});
  await guardarArchivo(`respaldo-flota-${today()}.json`,json,"application/json");
}
function importar(e){if(soloAdmin())return;
  const file=e.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.camiones)||!Array.isArray(d.fichas))throw 0;
    confirmar(`Importar ${d.camiones.length} camión(es) y ${d.fichas.length} ficha(s)? Los registros con el mismo identificador se reemplazan.`,"Importar",async()=>{
      for(const [id,u] of Object.entries(d.fotosData||{})){try{await Fotos.fromDataURL(id,u)}catch(e){}}
      d.camiones.forEach(c=>c.id&&Store.save("camiones",c));d.fichas.forEach(f=>f.id&&Store.save("fichas",f));(d.config||[]).forEach(c=>c.id&&Store.save("config",c));(d.alertas||[]).forEach(a=>a.id&&Store.save("alertas",a));render();toast("Respaldo importado")})}
    catch(err){toast("El archivo no es un respaldo válido")}};
  rd.readAsText(file);e.target.value="";
}

/* ===== Inicio ===== */
const h=location.hash.slice(1);if(h==="historial"||h==="alertas")state.view=h;
render();
Store.init();
})();
</script>
